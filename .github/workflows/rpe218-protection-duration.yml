name: RPE218 Protection Potion Duration
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe218-protection-duration.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Correct protection potion durations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/default/professions/alchemy.lua')
          text = path.read_text(encoding='utf-8')
          original = text
          assert text.count('    version = 17,') == 1

          aura_ids = {
              'p1shd50a', 'p2fir50a', 'p3frs50a', 'p4nat50a',
              'ga100ara', 'gf100fia', 'gf100fra', 'gn100naa', 'gs100sha',
          }
          spell_ids = {
              'p1shd50s', 'p2fir50s', 'p3frs50s', 'p4nat50s',
              'ga100ars', 'gf100fis', 'gf100frs', 'gn100nas', 'gs100shs',
          }

          def get_section(source, name, next_marker):
              start_marker = f'        {name} = {{\n'
              end_marker = f'        }},\n        {next_marker}'
              start = source.index(start_marker) + len(start_marker)
              end = source.index(end_marker, start)
              return start, end, source[start:end]

          def set_section(source, name, next_marker, inner):
              start, end, _ = get_section(source, name, next_marker)
              return source[:start] + inner + source[end:]

          def records(inner):
              found = re.findall(r'(?ms)^            \{\n.*?^            \},\n', inner)
              assert ''.join(found) == inner
              return found

          def record_id(record):
              match = re.search(r'^                id = "([^"]+)",$', record, flags=re.M)
              assert match
              return match.group(1)

          # Aura duration is authoritative persisted duration.
          _, _, aura_inner = get_section(text, 'auras', 'authorName =')
          rewritten = []
          changed_auras = 0
          for record in records(aura_inner):
              rid = record_id(record)
              if rid in aura_ids:
                  assert record.count('                duration = 10,\n') == 1
                  record = record.replace('                duration = 10,\n', '                duration = 3,\n', 1)
                  changed_auras += 1
              rewritten.append(record)
          assert changed_auras == 9
          text = set_section(text, 'auras', 'authorName =', ''.join(rewritten))

          # Spell apply_aura duration must match the Aura, while potion cooldown remains 10 turns.
          _, _, spell_inner = get_section(text, 'spells', 'stats = {},')
          rewritten = []
          changed_spells = 0
          for record in records(spell_inner):
              rid = record_id(record)
              if rid in spell_ids:
                  assert record.count('                            duration = 10,\n') == 1
                  assert record.count('                cooldown = 10,\n') == 1
                  record = record.replace('                            duration = 10,\n', '                            duration = 3,\n', 1)
                  assert '                cooldown = 10,\n' in record
                  changed_spells += 1
              rewritten.append(record)
          assert changed_spells == 9
          text = set_section(text, 'spells', 'stats = {},', ''.join(rewritten))

          text = text.replace('    version = 17,', '    version = 18,', 1)
          assert text.count('    version = 18,') == 1
          assert text != original

          # Deterministic post-write checks.
          _, _, final_auras = get_section(text, 'auras', 'authorName =')
          for record in records(final_auras):
              if record_id(record) in aura_ids:
                  assert '                duration = 3,\n' in record
                  assert '                duration = 10,\n' not in record

          _, _, final_spells = get_section(text, 'spells', 'stats = {},')
          for record in records(final_spells):
              if record_id(record) in spell_ids:
                  assert '                            duration = 3,\n' in record
                  assert '                            duration = 10,\n' not in record
                  assert '                cooldown = 10,\n' in record

          path.write_text(text, encoding='utf-8')
          print('Validated 9 protection auras and 9 protection spells at 3-turn duration; potion cooldowns remain 10 turns.')
          PY
          git diff --check
          test "$(git diff --name-only)" = "data/default/professions/alchemy.lua"
          git diff --stat -- data/default/professions/alchemy.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Set protection potions to three turns"
          git push origin dev

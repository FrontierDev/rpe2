name: Issue 192 Tailoring Recipes v5

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/issue-192-tailoring-recipes-v5.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Run finalized migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/issue-192-tailoring-recipes.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(script)

          # The original helper omitted final, non-comma-terminated items in a dataset.
          parser_old = 'if line.rstrip("\\r\\n") == "            },":'
          parser_new = 'if line.rstrip("\\r\\n") in ("            },", "            }"):'
          assert parser_old in script
          script = script.replace(parser_old, parser_new, 1)

          # Large Brilliant Shard is not represented by a packaged item and is allowed to be omitted.
          must_old = '"Golden Pearl", "Huge Emerald", "Star Ruby", "Large Brilliant Shard", "Rugged Leather",'
          must_new = '"Golden Pearl", "Huge Emerald", "Star Ruby", "Rugged Leather",'
          assert must_old in script
          script = script.replace(must_old, must_new, 1)

          # Resolve the concrete pre-existing recipe-name collision permitted by #192.
          # vxy1029k is the valid skill-95 Red Woolen Boots recipe; 74yqa5j0 is a
          # mislabeled skill-100 duplicate with the Blue Overalls-style input set.
          collision_anchor = 'recipes_before = parse_recipes(text)\n'
          assert collision_anchor in script
          collision_fix = '''
          pre_collision_recipes = parse_recipes(text)
          red_woolen = [entry for entry in pre_collision_recipes if entry[0] == "Red Woolen Boots"]
          assert len(red_woolen) == 2, f"Expected exactly two pre-existing Red Woolen Boots recipes, found {len(red_woolen)}"
          ids = {entry[1] for entry in red_woolen}
          assert ids == {"vxy1029k", "74yqa5j0"}, f"Unexpected Red Woolen Boots IDs: {ids}"
          valid_block = next(entry[2] for entry in red_woolen if entry[1] == "vxy1029k")
          bad_block = next(entry[2] for entry in red_woolen if entry[1] == "74yqa5j0")
          assert 'requiredSkillLevel = 95' in valid_block
          assert 'itemRef = "538a54a0:sm9q37oi"' in valid_block
          assert 'itemRef = "7259f1d3:oo8796rr"' in valid_block
          assert 'requiredSkillLevel = 100' in bad_block
          assert 'itemRef = "7259f1d3:nfwx3196"' in bad_block
          text = text.replace(bad_block, "", 1)
          assert sum(1 for entry in parse_recipes(text) if entry[0] == "Red Woolen Boots") == 1
          assert next(entry[1] for entry in parse_recipes(text) if entry[0] == "Red Woolen Boots") == "vxy1029k"

          recipes_before = parse_recipes(text)
'''
          script = script.replace(collision_anchor, textwrap.dedent(collision_fix), 1)

          # Account for the intentional one-record collision cleanup in the final count.
          old_count = 'assert len(recipes_after) == len(recipes_before) + 30, ('
          assert old_count in script
          # recipes_before is taken after collision cleanup, so +30 remains correct.

          # Explicitly require the corrected lower-skill record to remain after migration.
          final_anchor = 'for name in EXISTING_SKILL_300:\n'
          assert final_anchor in script
          final_check = '''assert sum(1 for entry in recipes_after if entry[0] == "Red Woolen Boots") == 1
assert next(entry[1] for entry in recipes_after if entry[0] == "Red Woolen Boots") == "vxy1029k"

'''
          # Insert into the final-validation occurrence only (last occurrence).
          pos = script.rfind(final_anchor)
          assert pos >= 0
          script = script[:pos] + final_check + script[pos:]

          exec(compile(script, 'issue-192-migration.py', 'exec'), {})
          PY

      - name: Validate diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff -- data/default/professions/tailoring.lua | grep -c '^+.*name = ' || true)" -eq 30
          test "$(git diff -- data/default/professions/tailoring.lua | grep -c '^-.*name = "Red Woolen Boots"' || true)" -eq 1
          grep -q '^    version = 5,$' data/default/professions/tailoring.lua
          test "$(git diff --name-only | grep -v '^data/default/professions/tailoring.lua$' | wc -l)" -eq 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/tailoring.lua
          git rm .github/workflows/issue-192-tailoring-recipes.yml
          git rm .github/workflows/issue-192-tailoring-recipes-v2.yml
          git rm .github/workflows/issue-192-tailoring-recipes-v3.yml
          git rm .github/workflows/issue-192-tailoring-recipes-v4.yml
          git rm .github/workflows/issue-192-tailoring-recipes-v5.yml
          git rm .github/workflows/issue-192-diagnose-recipes.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Add missing skill 300 Tailoring recipes"
          git push origin HEAD:dev

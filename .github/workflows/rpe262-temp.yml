name: RPE262 scoped data update

on:
  push:
    paths:
      - '.github/workflows/rpe262-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply focused Engineering item update
        run: python .github/rpe262_temp.py
      - name: Validate and commit
        run: |
          git diff --check
          git rm .github/rpe262_temp.py .github/workflows/rpe262-temp.yml
          git config user.name "ortellus"
          git config user.email "elvetgames@gmail.com"
          git add data/default/professions/engineering.lua
          git commit -m "Implement focused Engineering 150-225 items for #262"
          git push origin HEAD:dev

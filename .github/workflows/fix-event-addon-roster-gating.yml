name: Fix event addon roster gating

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-event-addon-roster-gating.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_event_addon_roster_gating.py
      - name: Commit patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server_Event.lua
          git diff --cached --check
          git commit -m "Ignore non-addon members during event start"
          git push origin HEAD:dev

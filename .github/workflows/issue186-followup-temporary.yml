name: issue186-followup-temporary

on:
  push:
    branches:
      - issue-186-followup-validation

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-186-followup-validation
          fetch-depth: 0

      - name: Apply Issue 186 follow-up fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          event_path = Path('client/client_Event.lua')
          event = event_path.read_text()

          marker = 'function Client:HandleEventStart(arguments, sender)\n'
          helper_lines = [
              'local function hydrateLocalHostAuthoritativeRoster(eventState)',
              '    if type(eventState) ~= "table" then',
              '        return false',
              '    end',
              '',
              '    local localPlayerName = Common.GetPlayerName and Common.GetPlayerName() or nil',
              '    localPlayerName = Common.NormalizeName and Common.NormalizeName(localPlayerName) or tostring(localPlayerName or "")',
              '    local eventHostName = Common.NormalizeName and Common.NormalizeName(eventState.hostName) or tostring(eventState.hostName or "")',
              '    if localPlayerName == "" or eventHostName == "" or eventHostName ~= localPlayerName then',
              '        return false',
              '    end',
              '',
              '    local serverEventState = Addon.Server and Addon.Server.EventState or nil',
              '    if type(serverEventState) ~= "table"',
              '        or serverEventState.active ~= true',
              '        or tostring(serverEventState.id or "") ~= tostring(eventState.id or "")',
              '        or type(serverEventState.SerializeUnitsForNetwork) ~= "function"',
              '        or type(Event.DeserializeUnitsFromNetwork) ~= "function"',
              '    then',
              '        return false',
              '    end',
              '',
              '    local units = Event.DeserializeUnitsFromNetwork(serverEventState:SerializeUnitsForNetwork())',
              '    if type(units) ~= "table" or #units == 0 then',
              '        return false',
              '    end',
              '',
              '    eventState.units = units',
              '    eventState.rosterReady = true',
              '    eventState.unitsChunkReceived = eventState.unitsChunkExpected or eventState.unitsChunkReceived or 0',
              '    return true',
              'end',
              '',
              'function Client:HandleEventStart(arguments, sender)',
          ]
          helper = '\n'.join(helper_lines) + '\n'
          event = replace_once(event, marker, helper, 'insert host authoritative roster helper')

          old_lines = [
              '    if type(self.EventState) == "table" then',
              '        clearEventStateNow(self, self.EventState, "event-replaced", {',
              '            cancelReason = "event-replaced",',
              '        })',
              '    end',
              '',
              '    local hydrateStartTime = timingParts and getTimingNowMilliseconds() or nil',
          ]
          new_lines = [
              '    if type(self.EventState) == "table" then',
              '        clearEventStateNow(self, self.EventState, "event-replaced", {',
              '            cancelReason = "event-replaced",',
              '        })',
              '    end',
              '',
              '    hydrateLocalHostAuthoritativeRoster(nextState)',
              '',
              '    local hydrateStartTime = timingParts and getTimingNowMilliseconds() or nil',
          ]
          event = replace_once(
              event,
              '\n'.join(old_lines) + '\n',
              '\n'.join(new_lines) + '\n',
              'hydrate host roster before readiness calculation',
          )
          event_path.write_text(event)

          resources_path = Path('client/client_Resources.lua')
          resources = resources_path.read_text()
          old = '    local capturedResources = ResourceSync.CloneResources and ResourceSync.CloneResources(resources) or resources\n'
          new = '\n'.join([
              '    local capturedResources = nil',
              '    if resources ~= nil then',
              '        capturedResources = ResourceSync.CloneResources and ResourceSync.CloneResources(resources) or resources',
              '    end',
          ]) + '\n'
          resources = replace_once(resources, old, new, 'preserve nil resource override')
          resources_path.write_text(resources)
          PY

      - name: Static and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = $'client/client_Event.lua\nclient/client_Resources.lua'

          python3 - <<'PY'
          from pathlib import Path
          import copy

          event = Path('client/client_Event.lua').read_text()
          resources = Path('client/client_Resources.lua').read_text()
          resource_sync = Path('core/internal/comms/ResourceSync.lua').read_text()

          assert 'nextState.rosterReady = false' in event
          assert 'local function hydrateLocalHostAuthoritativeRoster(eventState)' in event
          assert 'eventHostName ~= localPlayerName' in event
          assert 'local serverEventState = Addon.Server and Addon.Server.EventState or nil' in event
          assert 'serverEventState.active ~= true' in event
          assert 'tostring(serverEventState.id or "") ~= tostring(eventState.id or "")' in event
          assert 'serverEventState:SerializeUnitsForNetwork()' in event
          assert 'Event.DeserializeUnitsFromNetwork' in event
          assert 'eventState.rosterReady = true' in event
          assert 'hydrateLocalHostAuthoritativeRoster(nextState)' in event

          handle_start = event[event.index('function Client:HandleEventStart'):event.index('function Client:HandleEventEnd')]
          assert handle_start.index('nextState.rosterReady = false') < handle_start.index('hydrateLocalHostAuthoritativeRoster(nextState)')
          assert handle_start.index('hydrateLocalHostAuthoritativeRoster(nextState)') < handle_start.index('ResourceSync.UpdateEventReadiness(nextState)')

          helper = event[event.index('local function hydrateLocalHostAuthoritativeRoster'):event.index('function Client:HandleEventStart')]
          assert 'HandleEventUnits' not in helper
          assert 'SendMessage' not in helper
          assert 'SendToChannel' not in helper

          queue_start = resources.index('function Client:QueueClientResourceSync(reason, options)')
          queue_end = resources.index('function Client:ResolveLocalActiveSpellcasterResources', queue_start)
          queue = resources[queue_start:queue_end]
          assert 'local resources = options.resources' in queue
          assert 'if type(resources) == "table" and #resources == 0 then' in queue
          assert 'local capturedResources = nil' in queue
          assert 'if resources ~= nil then' in queue
          assert 'capturedResources = ResourceSync.CloneResources and ResourceSync.CloneResources(resources) or resources' in queue
          assert 'targetClient:SendClientResources(expectedState, syncReason, queuedPlayerName, queuedResources, targetEventId)' in queue

          assert 'unitsReady = rosterComplete and resourcesReady' in resource_sync

          EMPTY_REJECTED = object()
          def capture(override):
              if isinstance(override, list) and len(override) == 0:
                  return EMPTY_REJECTED
              if override is None:
                  return None
              return copy.deepcopy(override)

          def select_resources(override, authoritative, profile):
              if override is not None:
                  return override
              if authoritative is not None:
                  return authoritative
              return profile

          captured = capture(None)
          assert captured is None
          authoritative = [{'resourceRef': 'health', 'currentValue': 42, 'maxValue': 50}]
          profile = [{'resourceRef': 'health', 'currentValue': 50, 'maxValue': 50}]
          assert select_resources(captured, authoritative, profile) == authoritative
          assert select_resources(captured, None, profile) == profile

          override = [{'resourceRef': 'health', 'currentValue': 30, 'maxValue': 50}]
          captured = capture(override)
          assert captured == override and captured is not override
          override[0]['currentValue'] = 1
          assert captured[0]['currentValue'] == 30
          assert select_resources(captured, authoritative, profile) == captured
          assert capture([]) is EMPTY_REJECTED

          def host_roster_hydration(local_name, event_host, event_id, server_event):
              if not local_name or not event_host or event_host != local_name:
                  return False, False, []
              if not server_event or not server_event.get('active') or server_event.get('id') != event_id:
                  return False, False, []
              units = copy.deepcopy(server_event.get('units') or [])
              if not units:
                  return False, False, []
              return True, True, units

          authoritative_event = {
              'active': True,
              'id': 'evt-test',
              'units': [{'eventID': 1, 'isPlayer': True}, {'eventID': 2, 'isPlayer': True}],
          }
          applied, roster_ready, units = host_roster_hydration('Host', 'Host', 'evt-test', authoritative_event)
          assert applied and roster_ready and len(units) == 2
          applied, roster_ready, units = host_roster_hydration('Client', 'Host', 'evt-test', authoritative_event)
          assert not applied and not roster_ready and units == []
          applied, roster_ready, units = host_roster_hydration('Host', 'Host', 'evt-other', authoritative_event)
          assert not applied and not roster_ready and units == []

          run_start = event.index('local function runEventStartupStep')
          run_end = event.index('local function queueEventStartupWork', run_start)
          run = event[run_start:run_end]
          assert run.index('readiness.rosterComplete ~= true') < run.index('runtime.resourceSyncQueued ~= true')
          assert run.index('runtime.resourceSyncQueued ~= true') < run.index('readiness.resourcesReady ~= true')
          assert run.index('readiness.resourcesReady ~= true') < run.index('runtime.consumablesQueued ~= true')

          print('Issue 186 follow-up static/deterministic assertions: PASS')
          PY

          echo '--- diff stat ---'
          git diff --stat
          echo '--- diff ---'
          git diff -- client/client_Event.lua client/client_Resources.lua

      - name: Lua 5.1 syntax validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p client/client_Event.lua
          luac5.1 -p client/client_Resources.lua
          luac5.1 -p core/internal/comms/ResourceSync.lua
          echo 'Lua 5.1 syntax validation: PASS'

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Codex Connector'
          git config user.email 'noreply@openai.com'
          git add client/client_Event.lua client/client_Resources.lua
          git diff --cached --check
          git commit -m 'Fix host roster and resource sync startup blockers (#186)'
          git push origin HEAD:issue-186-followup-validation

name: RPE217 Purple Dye Patch

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe217-purple-dye.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch Tailoring dataset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('data/default/professions/tailoring.lua')
          text = path.read_text(encoding='utf-8')

          if 'name = "Purple Dye"' in text:
              raise SystemExit('Purple Dye already exists; refusing duplicate insertion')

          marker = '                name = "Coarse Thread",'
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit('Coarse Thread marker not found')

          insert_at = text.rfind('            {\n', 0, marker_index)
          if insert_at < 0:
              raise SystemExit('Could not locate Coarse Thread item block start')

          purple_dye = '''            {
              allowWowConversion = true,
              armorWeight = "cosmetic",
              bindingFlag = "none",
              blueSockets = 0,
              canDisenchant = false,
              canSell = true,
              canStack = true,
              canTrade = true,
              cogSockets = 0,
              conditions = {},
              consumableElixirType = "",
              consumableType = "",
              damageMode = "fixed",
              damagePerTurn = 0,
              description = "",
              gemColor = "none",
              genericModificationKey = "",
              greenSockets = 0,
              icon = "interface/icons/inv_potion_02.blp",
              id = "8p3vdy2m",
              isTwoHanded = false,
              itemLevel = 0,
              itemSetKey = "",
              itemType = "material",
              maxDamagePerTurn = 0,
              maxGenericModificationCounts = {},
              maxModificationCounts = {},
              maxStackSize = 200,
              metaSockets = 0,
              minDamagePerTurn = 0,
              modificationKind = "generic",
              name = "Purple Dye",
              prismaticSockets = 0,
              quality = "common",
              redSockets = 0,
              sellPrice = 0,
              skillBonuses = {},
              socketTypes = {},
              sockets = {},
              stats = {},
              tags = {},
              targetArmorWeight = "none",
              targetSlotRefs = {},
              uniqueFlag = "none",
              validSlotRefs = {},
              wowConversionSkillRef = "f82db71a:goqp0alw",
              yellowSockets = 0,
          },
'''

          old_version = '    version = 6,\n})\n'
          if text.count(old_version) != 1:
              raise SystemExit(f'Expected exactly one Tailoring version 6 footer, found {text.count(old_version)}')

          text = text[:insert_at] + purple_dye + text[insert_at:]
          text = text.replace(old_version, '    version = 7,\n})\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          test "$(grep -c 'name = \"Purple Dye\"' data/default/professions/tailoring.lua)" -eq 1
          test "$(grep -c 'id = \"8p3vdy2m\"' data/default/professions/tailoring.lua)" -eq 1
          grep -q 'version = 7,' data/default/professions/tailoring.lua

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/tailoring.lua
          git commit -m "Add Purple Dye to Tailoring for issue #217"
          git push origin HEAD:dev

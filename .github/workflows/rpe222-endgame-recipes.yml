              },
              learnMode = "trainer",
              name = "Major Rejuvenation Potion",
              output = {
                  itemRef = "d6ffc4e2:fdz4n63z",
                  maxQuantity = 1,
                  minQuantity = 1,
              },
              reagents = {},
              requiredSkillLevel = 300,
              results = {},
              skillRef = "f82db71a:pdyzyudy",
              tags = {},

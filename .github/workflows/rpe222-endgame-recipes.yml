name: RPE222 Alchemy endgame recipes

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe222-endgame-recipes.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Implement and validate Issue 222
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          alchemy_path = Path('data/default/professions/alchemy.lua')
          before = alchemy_path.read_text()
          doc = Path('.docs/RPE2-Alchemy-295-300-Preparation.md').read_text()
          recipe_class = Path('core/classes/Recipe.lua').read_text()
          crafting = Path('client/client_Crafting.lua').read_text()
          profile = Path('core/internal/profile/Profile.lua').read_text()
          deps = Path('core/internal/database/Dependecies.lua').read_text()
          enchanting = Path('data/default/professions/enchanting.lua').read_text()
          misc = Path('data/default/professions/misc.lua').read_text()

          assert len(re.findall(r'^\s*version = 24,\s*$', before, re.M)) == 1
          assert 'id = "d6ffc4e2"' in before
          assert 'kind ~= "rpe_item" and kind ~= "tool"' in recipe_class
          assert 'mode == "always_learned" or mode == "trainer" or mode == "book" or mode == "unavailable"' in recipe_class
          assert '75 + (level * 28) + (level * level * 1.6)' in crafting
          assert int(75 + 300 * 28 + 300 * 300 * 1.6) == 152475
          assert 'if row.kind == "tool" then' in crafting
          assert 'for index = 1, #(detail.materials or {}) do' in crafting
          assert 'unknownTrainerRecipeRefsBySkill' in profile
          assert 'getRecipeSourceRefs' not in deps

          specs = [
              {
                  'name': 'Flask of Petrification', 'id': 'p6r3t9vx',
                  'inputs': [('d6ffc4e2:d4sw4y04','rpe_item',30), ('d6ffc4e2:dvzvvc52','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1), ('d6ffc4e2:y9p4s8nt','tool',1)],
                  'output': ('d6ffc4e2:92h163gw',1,1),
              },
              {
                  'name': 'Flask of the Titans', 'id': 't7n4s2qw',
                  'inputs': [('d6ffc4e2:rerdartb','rpe_item',30), ('d6ffc4e2:d4sw4y04','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:fqzfqzvh',1,1),
              },
              {
                  'name': 'Flask of Distilled Wisdom', 'id': 'd8w5m3yk',
                  'inputs': [('d6ffc4e2:usfyk84u','rpe_item',30), ('d6ffc4e2:irt83rqo','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:qy3t5uyi',1,1),
              },
              {
                  'name': 'Flask of Supreme Power', 'id': 's9p2r6hz',
                  'inputs': [('d6ffc4e2:usfyk84u','rpe_item',30), ('d6ffc4e2:dvzvvc52','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:0ymoaskz',1,1),
              },
              {
                  'name': 'Flask of Chromatic Resistance', 'id': 'c4r8m1vn',
                  'inputs': [('d6ffc4e2:irt83rqo','rpe_item',30), ('d6ffc4e2:dvzvvc52','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:9u6ogptd',1,1),
              },
              {
                  'name': 'Major Rejuvenation Potion', 'id': 'j5v7n2qx',
                  'inputs': [('3eb7e9bb:w2plwren','rpe_item',1), ('d6ffc4e2:m1cdfomm','rpe_item',4), ('d6ffc4e2:usfyk84u','rpe_item',4), ('d6ffc4e2:5b2vp7y0','rpe_item',1)],
                  'output': ('d6ffc4e2:fdz4n63z',1,1),
              },
              {
                  'name': 'Transmute: Elemental Fire', 'id': 'e6f3t8kw',
                  'inputs': [('732368d4:50qj8dzw','rpe_item',1), ('d6ffc4e2:y9p4s8nt','tool',1)],
                  'output': ('732368d4:sclalidn',3,3),
              },
          ]

          for spec in specs:
              assert spec['name'] in doc
          for prepared in ('trainerCostCopper = 152475', '3eb7e9bb:w2plwren', '732368d4:50qj8dzw', '732368d4:sclalidn', 'd6ffc4e2:y9p4s8nt'):
              assert prepared in doc

          def assert_named_id(text, item_id, name, radius=2800):
              marker = f'id = "{item_id}"'
              assert text.count(marker) == 1, f'Expected one ID {item_id}'
              pos = text.index(marker)
              window = text[max(0, pos-radius):min(len(text), pos+radius)]
              assert f'name = "{name}"' in window, f'{item_id} is not {name}'

          for item_id, name in {
              'rerdartb':'Gromsblood', 'd4sw4y04':'Stonescale Oil', 'usfyk84u':'Dreamfoil',
              'dvzvvc52':'Mountain Silversage', 'irt83rqo':'Icecap', 'm1cdfomm':'Golden Sansam',
              '804x8qak':'Crystal Vial', '5b2vp7y0':'Imbued Vial', '151j6hkf':'Black Lotus',
              'y9p4s8nt':"Philosopher's Stone", '92h163gw':'Flask of Petrification',
              'fqzfqzvh':'Flask of the Titans', 'qy3t5uyi':'Flask of Distilled Wisdom',
              '0ymoaskz':'Flask of Supreme Power', '9u6ogptd':'Flask of Chromatic Resistance',
              'fdz4n63z':'Major Rejuvenation Potion',
          }.items():
              assert_named_id(before, item_id, name)
          assert_named_id(misc, 'w2plwren', 'Heart of the Wild')
          assert_named_id(enchanting, '50qj8dzw', 'Essence of Fire')
          assert_named_id(enchanting, 'sclalidn', 'Elemental Fire')

          def table_span(text, field):
              marker = f'        {field} = {{'
              start = text.index(marker)
              open_pos = text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  c = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1
              raise AssertionError(f'Unclosed {field} table')

          def top_level_records(table_text):
              start = table_text.index('{')
              depth = 0
              quote = None
              escape = False
              record_start = None
              spans = []
              for i in range(start, len(table_text)):
                  c = table_text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '{':
                      depth += 1
                      if depth == 2:
                          record_start = i
                  elif c == '}':
                      if depth == 2 and record_start is not None:
                          spans.append((record_start, i + 1))
                          record_start = None
                      depth -= 1
              return [table_text[s:e] for s, e in spans]

          def render_recipe(spec):
              out_ref, out_min, out_max = spec['output']
              lines = [
                  '            {',
                  '                category = "",',
                  '                description = "",',
                  f'                id = "{spec["id"]}",',
                  '                inputs = {',
              ]
              for ref, kind, quantity in spec['inputs']:
                  lines.extend([
                      '                    {',
                      f'                        itemRef = "{ref}",',
                      f'                        kind = "{kind}",',
                      f'                        quantity = {quantity},',
                      '                    },',
                  ])
              lines.extend([
                  '                },',
                  '                learnMode = "trainer",',
                  f'                name = "{spec["name"]}",',
                  '                output = {',
                  f'                    itemRef = "{out_ref}",',
                  f'                    maxQuantity = {out_max},',
                  f'                    minQuantity = {out_min},',
                  '                },',
                  '                reagents = {},',
                  '                requiredSkillLevel = 300,',
                  '                results = {},',
                  '                skillRef = "f82db71a:pdyzyudy",',
                  '                tags = {},',
                  '                trainerCostCopper = 152475,',
                  '            },',
              ])
              return '\n'.join(lines) + '\n'

          protected = {}
          for field in ('auras','items','spells'):
              s, e = table_span(before, field)
              protected[field] = before[s:e]

          rs, re_ = table_span(before, 'recipes')
          recipes_before = before[rs:re_]
          old_records = top_level_records(recipes_before)
          assert old_records
          assert 'requiredSkillLevel = 300' not in recipes_before
          assert 'learnMode = "book"' not in recipes_before
          for spec in specs:
              assert f'name = "{spec["name"]}"' not in recipes_before
              assert f'id = "{spec["id"]}"' not in before
          for forbidden in ("Alchemists' Stone", 'Volatile Healing Potion', 'Onslaught Elixir', "Adept's Elixir"):
              assert forbidden not in recipes_before

          records_text = ''.join(render_recipe(spec) for spec in specs)
          after = before.replace('    version = 24,', '    version = 25,', 1)
          rs2, re2 = table_span(after, 'recipes')
          close_char = re2 - 1
          line_start = after.rfind('\n', 0, close_char) + 1
          assert after[line_start:close_char].strip() == ''
          relative = line_start - rs2
          expected_recipes = after[rs2:re2]
          expected_recipes = expected_recipes[:relative] + records_text + expected_recipes[relative:]
          after = after[:line_start] + records_text + after[line_start:]
          alchemy_path.write_text(after)

          assert len(re.findall(r'^\s*version = 25,\s*$', after, re.M)) == 1
          rs3, re3 = table_span(after, 'recipes')
          recipes_after = after[rs3:re3]
          assert recipes_after == expected_recipes
          new_records = top_level_records(recipes_after)
          assert len(new_records) == len(old_records) + 7
          for field, old_value in protected.items():
              s, e = table_span(after, field)
              assert after[s:e] == old_value, f'Unexpected {field} change'

          names = []
          ids = []
          by_name = {}
          for record in new_records:
              nm = re.search(r'\n\s*name = "([^"]+)",', record)
              rid = re.search(r'\n\s*id = "([^"]+)",', record)
              if nm:
                  names.append(nm.group(1)); by_name[nm.group(1)] = record
              if rid:
                  ids.append(rid.group(1))
          assert len(names) == len(set(names))
          assert len(ids) == len(set(ids))

          input_re = re.compile(r'itemRef = "([^"]+)",\s*\n\s*kind = "([^"]+)",\s*\n\s*quantity = (\d+),')
          output_re = re.compile(r'output = \{\s*\n\s*itemRef = "([^"]+)",\s*\n\s*maxQuantity = (\d+),\s*\n\s*minQuantity = (\d+),')
          for spec in specs:
              assert names.count(spec['name']) == 1
              record = by_name[spec['name']]
              assert f'id = "{spec["id"]}"' in record
              assert 'learnMode = "trainer"' in record
              assert 'requiredSkillLevel = 300' in record
              assert 'trainerCostCopper = 152475' in record
              assert 'skillRef = "f82db71a:pdyzyudy"' in record
              actual_inputs = [(ref, kind, int(qty)) for ref, kind, qty in input_re.findall(record)]
              assert actual_inputs == spec['inputs'], (spec['name'], actual_inputs)
              match = output_re.search(record)
              assert match
              out_ref, out_max, out_min = match.groups()
              exp_ref, exp_min, exp_max = spec['output']
              assert (out_ref, int(out_min), int(out_max)) == (exp_ref, exp_min, exp_max)

          assert recipes_after.count('requiredSkillLevel = 300') == 7
          assert recipes_after.count('learnMode = "book"') == 0
          for forbidden in ("Alchemists' Stone", 'Volatile Healing Potion', 'Onslaught Elixir', "Adept's Elixir"):
              assert forbidden not in recipes_after

          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert changed == ['data/default/professions/alchemy.lua'], changed
          subprocess.run(['git','diff','--check'], check=True)
          print(f'Validated Alchemy v25: {len(old_records)} -> {len(new_records)} recipes; seven skill-300 trainer recipes with exact #219 inputs and outputs.')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Implement Alchemy 300 endgame recipes"
          git push origin HEAD:dev

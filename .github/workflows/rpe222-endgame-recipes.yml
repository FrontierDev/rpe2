name: RPE222 Alchemy endgame recipes

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe222-endgame-recipes.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Implement and validate Issue 222
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          alchemy_path = Path('data/default/professions/alchemy.lua')
          doc_path = Path('.docs/RPE2-Alchemy-295-300-Preparation.md')
          recipe_class_path = Path('core/classes/Recipe.lua')
          crafting_path = Path('client/client_Crafting.lua')
          profile_path = Path('core/internal/profile/Profile.lua')
          deps_path = Path('core/internal/database/Dependecies.lua')
          enchanting_path = Path('data/default/professions/enchanting.lua')
          misc_path = Path('data/default/professions/misc.lua')

          before = alchemy_path.read_text()
          doc = doc_path.read_text()
          recipe_class = recipe_class_path.read_text()
          crafting = crafting_path.read_text()
          profile = profile_path.read_text()
          deps = deps_path.read_text()
          enchanting = enchanting_path.read_text()
          misc = misc_path.read_text()

          assert len(re.findall(r'^\s*version = 24,\s*$', before, re.M)) == 1, 'Expected live Alchemy v24 after #221'
          assert 'id = "d6ffc4e2"' in before, 'Alchemy dataset ID missing'
          assert 'kind ~= "rpe_item" and kind ~= "tool"' in recipe_class, 'Recipe input-kind schema changed'
          assert 'mode == "always_learned" or mode == "trainer" or mode == "book" or mode == "unavailable"' in recipe_class, 'Recipe learn modes changed'
          assert '75 + (level * 28) + (level * level * 1.6)' in crafting, 'Trainer cost formula changed'
          assert int(75 + 300 * 28 + 300 * 300 * 1.6) == 152475
          assert 'if row.kind == "tool" then' in crafting, 'Tool/material separation changed'
          assert 'for index = 1, #(detail.materials or {}) do' in crafting, 'Material consumption path changed'
          assert 'unknownTrainerRecipeRefsBySkill' in profile, 'Trainer recipe knowledge indexing changed'
          assert 'getRecipeSourceRefs' not in deps, 'Dependency architecture changed; re-review required'

          expected_names = [
              'Flask of Petrification',
              'Flask of the Titans',
              'Flask of Distilled Wisdom',
              'Flask of Supreme Power',
              'Flask of Chromatic Resistance',
              'Major Rejuvenation Potion',
              'Transmute: Elemental Fire',
          ]
          for name in expected_names:
              assert name in doc, f'Missing #219 source-of-truth entry: {name}'
          for text in (
              'trainerCostCopper = 152475',
              'input: 1 Essence of Fire, kind = "rpe_item"',
              'input: Philosopher\'s Stone, kind = "tool"',
              'output: 3 Elemental Fire',
              '3eb7e9bb:w2plwren',
              '732368d4:50qj8dzw',
              '732368d4:sclalidn',
              'd6ffc4e2:y9p4s8nt',
          ):
              assert text in doc, f'Missing prepared decision: {text}'

          def assert_named_id(text, item_id, name, radius=2600):
              marker = f'id = "{item_id}"'
              assert text.count(marker) == 1, f'Expected exactly one item ID {item_id}'
              pos = text.index(marker)
              window = text[max(0, pos - radius):min(len(text), pos + radius)]
              assert f'name = "{name}"' in window, f'{item_id} does not resolve near {name}'

          internal_refs = {
              'rerdartb': 'Gromsblood',
              'd4sw4y04': 'Stonescale Oil',
              'usfyk84u': 'Dreamfoil',
              'dvzvvc52': 'Mountain Silversage',
              'irt83rqo': 'Icecap',
              'm1cdfomm': 'Golden Sansam',
              '804x8qak': 'Crystal Vial',
              '5b2vp7y0': 'Imbued Vial',
              '151j6hkf': 'Black Lotus',
              'y9p4s8nt': "Philosopher's Stone",
              '92h163gw': 'Flask of Petrification',
              'fqzfqzvh': 'Flask of the Titans',
              'qy3t5uyi': 'Flask of Distilled Wisdom',
              '0ymoaskz': 'Flask of Supreme Power',
              '9u6ogptd': 'Flask of Chromatic Resistance',
              'fdz4n63z': 'Major Rejuvenation Potion',
          }
          for item_id, name in internal_refs.items():
              assert_named_id(before, item_id, name)
          assert_named_id(misc, 'w2plwren', 'Heart of the Wild')
          assert_named_id(enchanting, '50qj8dzw', 'Essence of Fire')
          assert_named_id(enchanting, 'sclalidn', 'Elemental Fire')

          def table_span(text, field):
              marker = f'        {field} = {{'
              start = text.index(marker)
              open_pos = text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  c = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                      i += 1
                      continue
                  if c == '-' and i + 1 < len(text) and text[i + 1] == '-':
                      newline = text.find('\n', i + 2)
                      if newline < 0:
                          raise AssertionError(f'Unclosed {field} table')
                      i = newline + 1
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1
              raise AssertionError(f'Unclosed {field} table')

          def top_level_records(table_text):
              open_pos = table_text.index('{')
              depth = 0
              quote = None
              escape = False
              record_start = None
              spans = []
              i = open_pos
              while i < len(table_text):
                  c = table_text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                      i += 1
                      continue
                  if c == '-' and i + 1 < len(table_text) and table_text[i + 1] == '-':
                      newline = table_text.find('\n', i + 2)
                      if newline < 0:
                          break
                      i = newline + 1
                      continue
                  if c == '{':
                      depth += 1
                      if depth == 2:
                          record_start = i
                  elif c == '}':
                      if depth == 2 and record_start is not None:
                          spans.append((record_start, i + 1))
                          record_start = None
                      depth -= 1
                  i += 1
              return [table_text[s:e] for s, e in spans]

          protected_before = {}
          for field in ('auras', 'items', 'spells'):
              s, e = table_span(before, field)
              protected_before[field] = before[s:e]

          rs, re_ = table_span(before, 'recipes')
          recipes_before = before[rs:re_]
          assert len(top_level_records(recipes_before)) > 0, 'No existing recipes found'
          assert 'requiredSkillLevel = 300' not in recipes_before, 'Unexpected pre-existing skill-300 recipe'
          for name in expected_names:
              assert f'name = "{name}"' not in recipes_before, f'Pre-existing target recipe: {name}'
          for forbidden in ('Alchemists\' Stone', 'Volatile Healing Potion', 'Onslaught Elixir', "Adept's Elixir"):
              assert forbidden not in recipes_before, f'Out-of-scope recipe already present: {forbidden}'

          new_ids = {
              'Flask of Petrification': 'p6r3t9vx',
              'Flask of the Titans': 't7n4s2qw',
              'Flask of Distilled Wisdom': 'd8w5m3yk',
              'Flask of Supreme Power': 's9p2r6hz',
              'Flask of Chromatic Resistance': 'c4r8m1vn',
              'Major Rejuvenation Potion': 'j5v7n2qx',
              'Transmute: Elemental Fire': 'e6f3t8kw',
          }
          for recipe_id in new_ids.values():
              assert f'id = "{recipe_id}"' not in before, f'Recipe ID collision: {recipe_id}'

          recipe_records = '''            {
              category = "",

                  },
              },
              learnMode = "trainer",
              name = "Flask of the Titans",
              output = {
                  itemRef = "d6ffc4e2:fqzfqzvh",
                  maxQuantity = 1,
                  minQuantity = 1,
              },
              reagents = {},
              requiredSkillLevel = 300,
              results = {},
              skillRef = "f82db71a:pdyzyudy",
              tags = {},
              trainerCostCopper = 152475,
          },
          {
              category = "",
              description = "",
              id = "d8w5m3yk",
              inputs = {
                  {
                      itemRef = "d6ffc4e2:usfyk84u",
                      kind = "rpe_item",

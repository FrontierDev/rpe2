              id = "t7n4s2qw",
              inputs = {
                  {
                      itemRef = "d6ffc4e2:rerdartb",
                      kind = "rpe_item",
                      quantity = 30,
                  },
                  {
                      itemRef = "d6ffc4e2:d4sw4y04",
                      kind = "rpe_item",
                      quantity = 10,
                  },
                  {
                      itemRef = "d6ffc4e2:151j6hkf",
                      kind = "rpe_item",

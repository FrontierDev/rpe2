          },
          {
              category = "",
              description = "",
              id = "e6f3t8kw",
              inputs = {
                  {
                      itemRef = "732368d4:50qj8dzw",
                      kind = "rpe_item",
                      quantity = 1,
                  },
                  {
                      itemRef = "d6ffc4e2:y9p4s8nt",
                      kind = "tool",
                      quantity = 1,
                  },
              },
              learnMode = "trainer",
              name = "Transmute: Elemental Fire",
              output = {
                  itemRef = "732368d4:sclalidn",
                  maxQuantity = 3,
                  minQuantity = 3,
              },
              reagents = {},
              requiredSkillLevel = 300,
              results = {},
              skillRef = "f82db71a:pdyzyudy",
              tags = {},
              trainerCostCopper = 152475,
          },
'''

          after = before.replace('    version = 24,', '    version = 25,', 1)
          rs2, re2 = table_span(after, 'recipes')
          close_char = re2 - 1
          line_start = after.rfind('\n', 0, close_char) + 1
          assert after[line_start:close_char].strip() == '', 'Recipe closing brace is not isolated'
          insert_relative = line_start - rs2
          expected_recipes_after = after[rs2:re2]
          expected_recipes_after = expected_recipes_after[:insert_relative] + recipe_records + expected_recipes_after[insert_relative:]
          after = after[:line_start] + recipe_records + after[line_start:]
          alchemy_path.write_text(after)

          assert len(re.findall(r'^\s*version = 25,\s*$', after, re.M)) == 1, 'Alchemy version did not become 25'
          rs3, re3 = table_span(after, 'recipes')
          recipes_after = after[rs3:re3]
          assert recipes_after == expected_recipes_after, 'Existing recipe data changed outside the intended append'
          old_count = len(top_level_records(recipes_before))
          records_after = top_level_records(recipes_after)
          assert len(records_after) == old_count + 7, 'Expected exactly seven new recipes'

          for field, previous in protected_before.items():
              s, e = table_span(after, field)
              assert after[s:e] == previous, f'Unexpected change to {field} table'

          recipe_by_name = {}
          recipe_ids = []
          recipe_names = []
          for record in records_after:
              name_match = re.search(r'\n\s*name = "([^"]+)",', record)
              id_match = re.search(r'\n\s*id = "([^"]+)",', record)
              if name_match:
                  recipe_names.append(name_match.group(1))
                  recipe_by_name[name_match.group(1)] = record
              if id_match:
                  recipe_ids.append(id_match.group(1))
          assert len(recipe_names) == len(set(recipe_names)), 'Duplicate recipe name detected'
          assert len(recipe_ids) == len(set(recipe_ids)), 'Duplicate recipe ID detected'
          for name in expected_names:
              assert recipe_names.count(name) == 1, f'Expected exactly one recipe named {name}'
              record = recipe_by_name[name]
              assert f'id = "{new_ids[name]}"' in record
              assert 'learnMode = "trainer"' in record
              assert 'requiredSkillLevel = 300' in record
              assert 'skillRef = "f82db71a:pdyzyudy"' in record
              assert 'trainerCostCopper = 152475' in record
              assert 'reagents = {}' in record and 'results = {}' in record and 'tags = {}' in record

          specs = {
              'Flask of Petrification': {
                  'inputs': [('d6ffc4e2:d4sw4y04','rpe_item',30), ('d6ffc4e2:dvzvvc52','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1), ('d6ffc4e2:y9p4s8nt','tool',1)],
                  'output': ('d6ffc4e2:92h163gw',1,1),
              },
              'Flask of the Titans': {
                  'inputs': [('d6ffc4e2:rerdartb','rpe_item',30), ('d6ffc4e2:d4sw4y04','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:fqzfqzvh',1,1),
              },
              'Flask of Distilled Wisdom': {
                  'inputs': [('d6ffc4e2:usfyk84u','rpe_item',30), ('d6ffc4e2:irt83rqo','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:qy3t5uyi',1,1),
              },
              'Flask of Supreme Power': {
                  'inputs': [('d6ffc4e2:usfyk84u','rpe_item',30), ('d6ffc4e2:dvzvvc52','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:0ymoaskz',1,1),
              },
              'Flask of Chromatic Resistance': {
                  'inputs': [('d6ffc4e2:irt83rqo','rpe_item',30), ('d6ffc4e2:dvzvvc52','rpe_item',10), ('d6ffc4e2:151j6hkf','rpe_item',1), ('d6ffc4e2:804x8qak','rpe_item',1)],
                  'output': ('d6ffc4e2:9u6ogptd',1,1),
              },
              'Major Rejuvenation Potion': {
                  'inputs': [('3eb7e9bb:w2plwren','rpe_item',1), ('d6ffc4e2:m1cdfomm','rpe_item',4), ('d6ffc4e2:usfyk84u','rpe_item',4), ('d6ffc4e2:5b2vp7y0','rpe_item',1)],
                  'output': ('d6ffc4e2:fdz4n63z',1,1),
              },
              'Transmute: Elemental Fire': {
                  'inputs': [('732368d4:50qj8dzw','rpe_item',1), ('d6ffc4e2:y9p4s8nt','tool',1)],
                  'output': ('732368d4:sclalidn',3,3),
              },
          }
          input_pattern = re.compile(r'itemRef = "([^"]+)",\s*\n\s*kind = "([^"]+)",\s*\n\s*quantity = (\d+),')
          output_pattern = re.compile(r'output = \{\s*\n\s*itemRef = "([^"]+)",\s*\n\s*maxQuantity = (\d+),\s*\n\s*minQuantity = (\d+),')
          for name, spec in specs.items():
              record = recipe_by_name[name]
              actual_inputs = [(ref, kind, int(qty)) for ref, kind, qty in input_pattern.findall(record)]
              assert actual_inputs == spec['inputs'], f'Input mismatch for {name}: {actual_inputs}'
              output_match = output_pattern.search(record)
              assert output_match, f'Missing output for {name}'
              out_ref, out_max, out_min = output_match.groups()
              expected_ref, expected_min, expected_max = spec['output']
              assert (out_ref, int(out_min), int(out_max)) == (expected_ref, expected_min, expected_max), f'Output mismatch for {name}'

          assert recipes_after.count('requiredSkillLevel = 300') == 7, 'Unexpected skill-300 recipe count'
          assert recipes_after.count('learnMode = "book"') == 0, 'Project rule requires no book Alchemy recipes'
          for forbidden in ('Alchemists\' Stone', 'Volatile Healing Potion', 'Onslaught Elixir', "Adept's Elixir"):
              assert forbidden not in recipes_after, f'Out-of-scope recipe introduced: {forbidden}'

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == ['data/default/professions/alchemy.lua'], f'Unexpected changed files: {changed}'
          subprocess.run(['git', 'diff', '--check'], check=True)
          print(f'Validated Alchemy v25: {old_count} -> {old_count + 7} recipes; seven skill-300 trainer recipes; exact #219 inputs/outputs; tools retained; unsupported lab/cooldown constraints not faked.')

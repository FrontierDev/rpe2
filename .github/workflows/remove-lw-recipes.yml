name: Remove Leatherworking Recipes

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/remove-lw-recipes.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Remove selected canonical Leatherworking recipes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/default/professions/leatherworking.lua')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)

          targets = {
              'Onyxia Scale Cloak',
              'Spitfire Bracers',
              'Spitfire Gauntlets',
              'Spitfire Breastplate',
              'Sandstalker Bracers',
              'Sandstalker Gauntlets',
              'Sandstalker Breastplate',
          }

          recipe_marker_line = next(i for i, line in enumerate(lines) if line.strip() == 'recipes = {')

          # Parse the recipes table and identify each direct child table by brace depth,
          # ignoring braces inside quoted strings.
          depth = 0
          in_string = False
          quote = None
          escaped = False
          entry_start = None
          entry_name = None
          spans = []
          recipes_end_line = None

          for line_index in range(recipe_marker_line, len(lines)):
              line = lines[line_index]
              name_match = re.search(r'^\s*name = "([^"]+)",\s*$', line)
              if entry_start is not None and name_match:
                  entry_name = name_match.group(1)

              for ch in line:
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          in_string = False
                      continue

                  if ch in ('"', "'"):
                      in_string = True
                      quote = ch
                      continue

                  if ch == '{':
                      if depth == 1 and entry_start is None:
                          entry_start = line_index
                          entry_name = None
                      depth += 1
                  elif ch == '}':
                      previous = depth
                      depth -= 1
                      if previous == 2 and depth == 1 and entry_start is not None:
                          spans.append((entry_start, line_index, entry_name))
                          entry_start = None
                          entry_name = None
                      elif previous == 1 and depth == 0:
                          recipes_end_line = line_index
                          break
              if recipes_end_line is not None:
                  break

          assert recipes_end_line is not None, 'Could not locate end of recipes table'
          assert len(spans) == 179, f'Expected 179 Leatherworking recipes before removal, found {len(spans)}'

          found = {name: 0 for name in targets}
          remove_lines = set()
          for start, end, name in spans:
              if name in targets:
                  found[name] += 1
                  remove_lines.update(range(start, end + 1))

          assert all(count == 1 for count in found.values()), f'Target recipe occurrence mismatch: {found}'

          corrected_lines = [line for i, line in enumerate(lines) if i not in remove_lines]
          corrected = ''.join(corrected_lines)

          # Bump packaged dataset version so existing SavedVariables receive the removal.
          version_pattern = re.compile(r'^    version = (\d+),\s*$', re.MULTILINE)
          versions = version_pattern.findall(corrected)
          assert versions == ['13'], f'Expected Leatherworking version 13 before removal, found {versions}'
          corrected, replacements = version_pattern.subn('    version = 14,', corrected, count=1)
          assert replacements == 1

          # Re-parse direct recipe children in the corrected text for an exact count.
          corrected_lines2 = corrected.splitlines(keepends=True)
          marker2 = next(i for i, line in enumerate(corrected_lines2) if line.strip() == 'recipes = {')
          depth = 0
          in_string = False
          quote = None
          escaped = False
          corrected_count = 0
          for line_index in range(marker2, len(corrected_lines2)):
              for ch in corrected_lines2[line_index]:
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          in_string = False
                      continue
                  if ch in ('"', "'"):
                      in_string = True
                      quote = ch
                      continue
                  if ch == '{':
                      if depth == 1:
                          corrected_count += 1
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          break
              if depth == 0 and line_index > marker2:
                  break

          assert corrected_count == 172, f'Expected 172 recipes after removal, found {corrected_count}'
          assert 'learnMode = "book"' not in corrected, 'Book recipe unexpectedly reintroduced'
          assert version_pattern.findall(corrected) == ['14'], 'Version bump failed'

          # Item records must remain. Each removed recipe name should still occur once as its item name.
          for name in targets:
              occurrences = corrected.count(f'name = "{name}"')
              assert occurrences == 1, f'Expected item definition for {name} to remain exactly once, found {occurrences}'

          path.write_text(corrected, encoding='utf-8')
          print('Removed 7 recipes; 179 -> 172 canonical Leatherworking recipes; item records retained; version 14')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^    version = 14,$' data/default/professions/leatherworking.lua
          ! grep -q 'learnMode = "book"' data/default/professions/leatherworking.lua

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/leatherworking.lua
          git rm .github/workflows/remove-lw-recipes.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Remove selected Leatherworking recipes"
          git push origin HEAD:dev

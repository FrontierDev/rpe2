name: RPE218 Alchemy Trainer Modes
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe218-all-alchemy-trainer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Correct Alchemy recipe learning modes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/default/professions/alchemy.lua')
          text = path.read_text(encoding='utf-8')
          assert text.count('Addon.Data.DefaultDatasets:Register({') == 1
          assert 'version = 16,' in text

          start_marker = '        recipes = {\n'
          end_marker = '\n        resources = {},'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          prefix = text[:start]
          recipes = text[start:end]
          suffix = text[end:]

          before_book = recipes.count('learnMode = "book"')
          before_trainer = recipes.count('learnMode = "trainer"')
          before_always = recipes.count('learnMode = "always_learned"')
          assert before_book > 0
          assert before_always == 3

          recipes = recipes.replace('learnMode = "book"', 'learnMode = "trainer"')
          text = prefix + recipes + suffix
          text = text.replace('    version = 16,', '    version = 17,', 1)

          recipe_blocks = re.findall(r'            \{\n(.*?)\n            \},', recipes, flags=re.S)
          levels = []
          modes = []
          for block in recipe_blocks:
              level_match = re.search(r'requiredSkillLevel = (\d+),', block)
              mode_match = re.search(r'learnMode = "([^"]+)",', block)
              if level_match and mode_match:
                  levels.append(int(level_match.group(1)))
                  modes.append(mode_match.group(1))

          assert len(levels) == 98, len(levels)
          assert sum(1 for level in levels if level == 1) == 3
          assert all(mode == 'always_learned' for level, mode in zip(levels, modes) if level == 1)
          assert all(mode == 'trainer' for level, mode in zip(levels, modes) if level > 1)
          assert 'learnMode = "book"' not in recipes
          assert recipes.count('learnMode = "trainer"') == before_trainer + before_book
          assert text.count('    version = 17,') == 1

          path.write_text(text, encoding='utf-8')
          print(f'converted_book={before_book} trainer_total={before_trainer + before_book} level1={before_always}')
          PY
          git diff --check
          git diff -- data/default/professions/alchemy.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Correct Alchemy recipe trainer modes"
          git push origin dev

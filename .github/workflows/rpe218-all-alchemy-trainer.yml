name: RPE218 Alchemy Corrections
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe218-all-alchemy-trainer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply Alchemy corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/default/professions/alchemy.lua')
          text = path.read_text(encoding='utf-8')
          original = text
          assert text.count('Addon.Data.DefaultDatasets:Register({') == 1
          assert text.count('    version = 16,') == 1

          def get_section(source, name, next_marker):
              start_marker = f'        {name} = {{\n'
              end_marker = f'        }},\n        {next_marker}'
              start = source.index(start_marker) + len(start_marker)
              end = source.index(end_marker, start)
              return start, end, source[start:end]

          def set_section(source, name, next_marker, inner):
              start, end, _ = get_section(source, name, next_marker)
              return source[:start] + inner + source[end:]

          def records(inner):
              found = re.findall(r'(?ms)^            \{\n.*?^            \},\n', inner)
              assert ''.join(found) == inner
              return found

          def record_id(record):
              match = re.search(r'^                id = "([^"]+)",$', record, flags=re.M)
              assert match
              return match.group(1)

          protection = {
              's7s4p9bg': dict(name='Shadow Protection Potion', aura_name='Shadow Protection', icon='interface/icons/inv_potion_44.blp', stat='f82db71a:itpo751d', value=50, aura='p1shd50a', spell='p1shd50s', key='shadow-protection-potion-aura'),
              'c5f9p4rx': dict(name='Fire Protection Potion', aura_name='Fire Protection', icon='interface/icons/inv_potion_16.blp', stat='f82db71a:0w7c7p09', value=50, aura='p2fir50a', spell='p2fir50s', key='fire-protection-potion-aura'),
              'k4f8p3zf': dict(name='Frost Protection Potion', aura_name='Frost Protection', icon='interface/icons/inv_potion_13.blp', stat='f82db71a:jjn0my8k', value=50, aura='p3frs50a', spell='p3frs50s', key='frost-protection-potion-aura'),
              'l5n9p4ag': dict(name='Nature Protection Potion', aura_name='Nature Protection', icon='interface/icons/inv_potion_06.blp', stat='f82db71a:pg0ytacb', value=50, aura='p4nat50a', spell='p4nat50s', key='nature-protection-potion-aura'),
              '8nrjnyxg': dict(name='Greater Arcane Protection Potion', aura_name='Greater Arcane Protection', icon='interface/icons/inv_potion_83.blp', stat='f82db71a:954yunb9', value=100, aura='ga100ara', spell='ga100ars', key='greater-arcane-protection-potion-aura'),
              'w4yo4wsz': dict(name='Greater Fire Protection Potion', aura_name='Greater Fire Protection', icon='interface/icons/inv_potion_24.blp', stat='f82db71a:0w7c7p09', value=100, aura='gf100fia', spell='gf100fis', key='greater-fire-protection-potion-aura'),
              '33j8eydr': dict(name='Greater Frost Protection Potion', aura_name='Greater Frost Protection', icon='interface/icons/inv_potion_20.blp', stat='f82db71a:jjn0my8k', value=100, aura='gf100fra', spell='gf100frs', key='greater-frost-protection-potion-aura'),
              '83krrxa2': dict(name='Greater Nature Protection Potion', aura_name='Greater Nature Protection', icon='interface/icons/inv_potion_22.blp', stat='f82db71a:pg0ytacb', value=100, aura='gn100naa', spell='gn100nas', key='greater-nature-protection-potion-aura'),
              'ad3773v7': dict(name='Greater Shadow Protection Potion', aura_name='Greater Shadow Protection', icon='interface/icons/inv_potion_23.blp', stat='f82db71a:itpo751d', value=100, aura='gs100sha', spell='gs100shs', key='greater-shadow-protection-potion-aura'),
          }
          for spec in protection.values():
              assert f'id = "{spec["aura"]}"' not in text
              assert f'id = "{spec["spell"]}"' not in text

          detect_ids = {'m6d1i5bh', 'splqphvj', '91znxtaq'}
          detect_names = {'Elixir of Detect Lesser Invisibility', 'Elixir of Detect Undead', 'Elixir of Detect Demon'}

          _, _, items_inner = get_section(text, 'items', 'loot = {},')
          item_records = records(items_inner)
          assert all(sum(f'id = "{item_id}"' in record for record in item_records) == 1 for item_id in detect_ids)
          assert all(sum(f'id = "{item_id}"' in record for record in item_records) == 1 for item_id in protection)
          assert sum('id = "2hrtx9s4"' in record for record in item_records) == 1

          rewritten_items = []
          removed_items = 0
          for record in item_records:
              item_id = record_id(record)
              if item_id in detect_ids:
                  removed_items += 1
                  continue
              if item_id in protection:
                  spec = protection[item_id]
                  assert 'useSpellRef =' not in record
                  needle = '                quality = "common",\n'
                  assert record.count(needle) == 1
                  record = record.replace(needle, needle + f'                useSpellRef = "d6ffc4e2:{spec["spell"]}",\n', 1)
              if item_id == '2hrtx9s4':
                  assert 'consumableElixirType = "battle"' in record
                  assert 'consumableTrait =' not in record
                  needle = '                consumableElixirType = "battle",\n'
                  trait = ''.join([
                      '                consumableTrait = {\n',
                      '                    phase = "event_start",\n',
                      '                    statBonuses = {\n',
                      '                        {\n',
                      '                            operation = "flat",\n',
                      '                            statRef = "f82db71a:qh534ffl",\n',
                      '                            value = 25,\n',
                      '                        },\n',
                      '                    },\n',
                      '                },\n',
                  ])
                  record = record.replace(needle, needle + trait, 1)
              rewritten_items.append(record)
          assert removed_items == 3
          text = set_section(text, 'items', 'loot = {},', ''.join(rewritten_items))

          _, _, recipes_inner = get_section(text, 'recipes', 'resources = {},')
          recipe_records = records(recipes_inner)
          assert len(recipe_records) == 75, len(recipe_records)
          rewritten_recipes = []
          removed_recipes = []
          for record in recipe_records:
              if any(f'd6ffc4e2:{item_id}' in record for item_id in detect_ids):
                  removed_recipes.append(record)
                  continue
              level_match = re.search(r'^                requiredSkillLevel = (\d+),$', record, flags=re.M)
              mode_match = re.search(r'^                learnMode = "([^"]+)",$', record, flags=re.M)
              assert level_match and mode_match
              level = int(level_match.group(1))
              wanted_mode = 'always_learned' if level == 1 else 'trainer'
              record = re.sub(r'^                learnMode = "[^"]+",$', f'                learnMode = "{wanted_mode}",', record, count=1, flags=re.M)
              rewritten_recipes.append(record)
          assert len(removed_recipes) == 2
          assert all(('Elixir of Detect Undead' in record or 'Elixir of Detect Demon' in record) for record in removed_recipes)
          text = set_section(text, 'recipes', 'resources = {},', ''.join(rewritten_recipes))

          def aura_block(spec):
              return ''.join([
                  '            {\n',
                  '                description = "",\n',
                  '                duration = 10,\n',
                  '                effects = {\n',
                  '                    {\n',
                  f'                        baseAmount = {spec["value"]},\n',
                  '                        operation = "flat",\n',
                  f'                        statRef = "{spec["stat"]}",\n',
                  '                        statScaling = {},\n',
                  '                        type = "stat",\n',
                  '                    },\n',
                  '                },\n',
                  '                events = {},\n',
                  f'                icon = "{spec["icon"]}",\n',
                  f'                id = "{spec["aura"]}",\n',
                  '                maxStacks = 1,\n',
                  f'                name = "{spec["aura_name"]}",\n',
                  '                stackBehavior = "refresh_duration",\n',
                  '                tags = {},\n',
                  '            },\n',
              ])

          def spell_block(spec):
              return ''.join([
                  '            {\n',
                  '                castTime = 0,\n',
                  '                charges = 0,\n',
                  '                components = {\n',
                  '                    {\n',
                  '                        castPhase = "on_cast_end",\n',
                  '                        castingGroup = "default",\n',
                  '                        effect = {\n',
                  f'                            auraRef = "d6ffc4e2:{spec["aura"]}",\n',
                  '                            basePower = 0,\n',
                  '                            duration = 10,\n',
                  '                            stacks = 1,\n',
                  '                            targetEvents = {},\n',
                  '                            type = "apply_aura",\n',
                  '                        },\n',
                  f'                        key = "{spec["key"]}",\n',
                  '                        target = {\n',
                  '                            type = "caster",\n',
                  '                        },\n',
                  '                    },\n',
                  '                },\n',
                  '                conditions = {},\n',
                  '                cooldown = 10,\n',
                  '                cooldownGroup = "potion",\n',
                  '                description = "",\n',
                  f'                icon = "{spec["icon"]}",\n',
                  f'                id = "{spec["spell"]}",\n',
                  '                ignoreGCD = true,\n',
                  '                learnMode = "unavailable",\n',
                  f'                name = "{spec["name"]}",\n',
                  '                resourceCosts = {},\n',
                  '                tags = {},\n',
                  '                triggersGCD = false,\n',
                  '            },\n',
              ])

          _, _, auras_inner = get_section(text, 'auras', 'authorName =')
          text = set_section(text, 'auras', 'authorName =', auras_inner + ''.join(aura_block(spec) for spec in protection.values()))
          _, _, spells_inner = get_section(text, 'spells', 'stats = {},')
          text = set_section(text, 'spells', 'stats = {},', spells_inner + ''.join(spell_block(spec) for spec in protection.values()))
          text = text.replace('    version = 16,', '    version = 17,', 1)

          assert text.count('    version = 17,') == 1
          assert '    version = 16,' not in text
          for item_id in detect_ids:
              assert f'id = "{item_id}"' not in text
              assert f'd6ffc4e2:{item_id}' not in text
          for name in detect_names:
              assert name not in text

          _, _, final_recipes_inner = get_section(text, 'recipes', 'resources = {},')
          final_recipes = records(final_recipes_inner)
          assert len(final_recipes) == 73, len(final_recipes)
          level1 = 0
          trainer = 0
          transmute = []
          for record in final_recipes:
              level = int(re.search(r'^                requiredSkillLevel = (\d+),$', record, flags=re.M).group(1))
              mode = re.search(r'^                learnMode = "([^"]+)",$', record, flags=re.M).group(1)
              if level == 1:
                  level1 += 1
                  assert mode == 'always_learned'
              else:
                  trainer += 1
                  assert mode == 'trainer'
              if 'name = "Transmute:' in record:
                  transmute.append(record)
          assert level1 == 3
          assert trainer == 70
          assert 'learnMode = "book"' not in final_recipes_inner
          assert len(transmute) == 9, len(transmute)
          for record in transmute:
              assert 'learnMode = "trainer"' in record
              assert 'itemRef = "d6ffc4e2:y9p4s8nt"' in record
              assert 'kind = "tool"' in record

          _, _, final_items_inner = get_section(text, 'items', 'loot = {},')
          final_items = records(final_items_inner)
          demon_record = next(record for record in final_items if 'id = "2hrtx9s4"' in record)
          assert 'consumableElixirType = "battle"' in demon_record
          assert 'statRef = "f82db71a:qh534ffl"' in demon_record
          assert 'value = 25,' in demon_record

          _, _, final_auras_inner = get_section(text, 'auras', 'authorName =')
          final_auras = records(final_auras_inner)
          _, _, final_spells_inner = get_section(text, 'spells', 'stats = {},')
          final_spells = records(final_spells_inner)
          for item_id, spec in protection.items():
              item_record = next(record for record in final_items if f'id = "{item_id}"' in record)
              aura_record = next(record for record in final_auras if f'id = "{spec["aura"]}"' in record)
              spell_record = next(record for record in final_spells if f'id = "{spec["spell"]}"' in record)
              assert f'useSpellRef = "d6ffc4e2:{spec["spell"]}"' in item_record
              assert f'baseAmount = {spec["value"]},' in aura_record
              assert f'statRef = "{spec["stat"]}"' in aura_record
              assert 'duration = 10,' in aura_record
              assert f'auraRef = "d6ffc4e2:{spec["aura"]}"' in spell_record
              assert 'type = "caster"' in spell_record
              assert 'cooldown = 10,' in spell_record

          holy_record = next(record for record in final_items if 'id = "j7h4p9kd"' in record)
          assert 'useSpellRef =' not in holy_record
          assert text != original
          path.write_text(text, encoding='utf-8')
          print('Alchemy corrections validated: 73 recipes; 70 trainer; 3 skill-1; 9 transmutes; 9 protection effects; detect potions removed.')
          PY
          git diff --check
          test "$(git diff --name-only)" = "data/default/professions/alchemy.lua"
          git diff --stat -- data/default/professions/alchemy.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Correct Alchemy recipes and potion effects"
          git push origin dev

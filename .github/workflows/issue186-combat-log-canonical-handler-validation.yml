name: issue186-combat-log-canonical-handler-validation

on:
  push:
    branches:
      - issue-186-combat-log-canonical-handler

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-186-combat-log-canonical-handler
          fetch-depth: 0

      - name: Apply canonical combat-log handler fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path('client/client_CombatLog.lua')
          text = base.read_text()
          start = text.index('function Client:HandleCombatLog(arguments, sender, distribution, target, message)')
          end = text.index('function Client:EmitCombatLogEntry(entry)', start)
          block = text[start:end]
          old = '        detailText = arguments and arguments[14],\n    })'
          new = '        detailText = arguments and arguments[14],\n        turnNumber = arguments and arguments[15],\n    })'
          if block.count(old) != 1:
              raise SystemExit(f'expected one turn insertion point in base HandleCombatLog, found {block.count(old)}')
          block = block.replace(old, new, 1)
          base.write_text(text[:start] + block + text[end:])

          ext = Path('client/client_CombatLogTurnIdentity.lua')
          text = ext.read_text()
          start = text.index('function Client:HandleCombatLog(arguments, sender, distribution, target, message)')
          end = text.index('\nClient._combatLogTurnIdentityExtensionInstalled = true', start)
          ext.write_text(text[:start] + text[end:])
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' "$(git diff --name-only)" | sort > /tmp/changed.txt
          printf '%s\n' 'client/client_CombatLog.lua' 'client/client_CombatLogTurnIdentity.lua' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

          test "$(grep -R --include='*.lua' -n 'function Client:HandleCombatLog(arguments, sender, distribution, target, message)' client | wc -l)" -eq 1

          python3 - <<'PY'
          from pathlib import Path
          base = Path('client/client_CombatLog.lua').read_text()
          ext = Path('client/client_CombatLogTurnIdentity.lua').read_text()
          block = base[base.index('function Client:HandleCombatLog'):base.index('function Client:EmitCombatLogEntry')]
          assert 'turnNumber = arguments and arguments[15],' in block
          assert 'distribution == "PARTY" or distribution == "RAID"' in block
          assert 'normalizedSender == localPlayerName' in block
          assert 'function Client:HandleCombatLog' not in ext
          assert 'normalized.turnNumber = resolveTurnNumber' in ext
          assert 'arguments[15] = normalized.turnNumber or ""' in ext
          print('Issue 186 canonical combat-log handler static assertions: PASS')
          PY

      - name: Lua 5.1 syntax and deterministic behavior
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p client/client_CombatLog.lua
          luac5.1 -p client/client_CombatLogTurnIdentity.lua

          cat >/tmp/issue186_combatlog_canonical.lua <<'LUA'
          local queued = 0
          local lastQueued = nil
          local Addon = {
              Client = {},
              Internal = {
                  Comms = { Operations = {} },
                  Profile = {},
                  Database = { Dependecies = {}, Classes = {} },
                  Registry = {},
              },
              Utils = {
                  Common = {
                      GetPlayerName = function() return "Host" end,
                      NormalizeName = function(value) return tostring(value or ""):lower() end,
                  },
              },
              UI = {},
          }

          assert(loadfile('client/client_CombatLog.lua'))(nil, Addon)
          assert(loadfile('client/client_CombatLogTurnIdentity.lua'))(nil, Addon)

          local Client = Addon.Client
          Client.EventState = { active = true, id = 'evt', turnNumber = 7 }
          function Client:QueueCombatLogEntry(entry)
              queued = queued + 1
              lastQueued = entry
              return true
          end

          local function args(turnNumber)
              local t = {
                  [1] = 'evt',
                  [2] = 'status',
                  [3] = 'Caster',
                  [14] = 'detail',
              }
              if turnNumber ~= nil then
                  t[15] = turnNumber
              end
              return t
          end

          assert(Client:HandleCombatLog(args(3), 'Host', 'PARTY') == true)
          assert(queued == 0, 'host PARTY physical self-copy must not queue')

          assert(Client:HandleCombatLog(args(3), 'Host', 'RAID') == true)
          assert(queued == 0, 'host RAID physical self-copy must not queue')

          assert(Client:HandleCombatLog(args(3), 'Remote', 'PARTY') == true)
          assert(queued == 1, 'remote PARTY entry should queue once')
          assert(lastQueued.turnNumber == 3, 'explicit remote turn identity must be preserved')

          assert(Client:HandleCombatLog(args(4), 'Host', 'LOCAL') == true)
          assert(queued == 2, 'host LOCAL emission should queue once')
          assert(lastQueued.turnNumber == 4, 'explicit local turn identity must be preserved')

          assert(Client:HandleCombatLog(args(nil), 'Remote', 'PARTY') == true)
          assert(queued == 3, 'remote entry without explicit turn should still queue')
          assert(lastQueued.turnNumber == 7, 'missing turn identity should fall back to active event turn')

          print('Issue 186 canonical combat-log handler deterministic regression: PASS')
          LUA
          lua5.1 /tmp/issue186_combatlog_canonical.lua

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ortellus"
          git config user.email "elvetgames@gmail.com"
          git add client/client_CombatLog.lua client/client_CombatLogTurnIdentity.lua
          git commit -m "Use canonical combat-log handler for turn identity (#186)"
          git rm .github/workflows/issue186-combat-log-canonical-handler-validation.yml
          git commit -m "Remove temporary Issue 186 canonical handler validation workflow"
          git push origin HEAD:issue-186-combat-log-canonical-handler

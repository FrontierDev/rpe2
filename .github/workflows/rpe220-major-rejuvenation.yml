name: RPE220 Major Rejuvenation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe220-major-rejuvenation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Implement and validate Issue 220
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          alchemy_path = Path('data/default/professions/alchemy.lua')
          doc_path = Path('.docs/RPE2-Alchemy-295-300-Preparation.md')
          enchanting_path = Path('data/default/professions/enchanting.lua')

          alchemy_before = alchemy_path.read_text()
          doc = doc_path.read_text()
          enchanting = enchanting_path.read_text()

          assert re.search(r'^\s*version = 22,\s*$', alchemy_before, re.M), 'Expected live Alchemy v22'
          assert alchemy_before.count('id = "mr1600hm"') == 0, 'Major Rejuvenation spell ID already exists'
          assert alchemy_before.count('name = "Major Rejuvenation Potion"') == 0, 'Major Rejuvenation already exists'
          assert 'Heart of Fire' in doc, 'Preparation doc no longer contains Heart of Fire substitution target'

          essence_marker = 'name = "Essence of Fire"'
          assert enchanting.count(essence_marker) == 1, 'Expected exactly one Enchanting Essence of Fire item'
          essence_pos = enchanting.index(essence_marker)
          prefix = enchanting[max(0, essence_pos - 3500):essence_pos]
          ids = re.findall(r'\bid = "([^"]+)"', prefix)
          assert ids, 'Could not resolve Essence of Fire ID'
          essence_id = ids[-1]
          essence_ref = f'732368d4:{essence_id}'

          def table_span(text, field_name):
              marker = f'{field_name} = {{'
              start = text.index(marker)
              open_pos = text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  c = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                      i += 1
                      continue
                  if c == '-' and i + 1 < len(text) and text[i + 1] == '-':
                      nl = text.find('\n', i + 2)
                      if nl == -1:
                          return start, len(text)
                      i = nl + 1
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1
              raise AssertionError(f'Unclosed {field_name} table')

          protected_before = {}
          for field in ('auras', 'items', 'recipes'):
              s, e = table_span(alchemy_before, field)
              protected_before[field] = alchemy_before[s:e]

          spell_record = '''            {
              castTime = 0,
              components = {
                  {
                      castPhase = "on_cast_end",
                      castingGroup = "default",
                      effect = {
                          amountMode = "flat",
                          baseHealing = 1600,
                          statScaling = {},
                          targetEvents = {},
                          type = "heal",
                      },
                      key = "major-rejuvenation-potion-heal",
                      target = {
                          type = "caster",
                      },
                  },
                  {
                      castPhase = "on_cast_end",
                      castingGroup = "default",
                      effect = {
                          amount = 1600,
                          amountMode = "flat",
                          resourceRef = "f82db71a:4c8mfm99",
                          targetEvents = {},
                          type = "resource",
                      },
                      key = "major-rejuvenation-potion-mana",
                      target = {
                          type = "caster",
                      },
                  },
              },
              conditions = {},
              cooldown = 10,
              cooldownGroup = "potion",
              description = "",
              icon = "interface/icons/inv_potion_47.blp",
              id = "mr1600hm",
              ignoreGCD = true,
              learnMode = "unavailable",
              name = "Major Rejuvenation Potion",
              resourceCosts = {},
              tags = {},
              triggersGCD = false,
          },
          '''

          alchemy = alchemy_before.replace('    version = 22,', '    version = 23,', 1)
          _, spell_end = table_span(alchemy, 'spells')
          close_pos = spell_end - 1
          alchemy = alchemy[:close_pos] + spell_record + alchemy[close_pos:]

          doc = doc.replace('Heart of Fire', 'Essence of Fire')

          replacement_74 = f'''### 7.4 Existing Enchanting material: Essence of Fire

          `Essence of Fire` is the approved RPE input for Transmute: Elemental Fire and already exists in the packaged Enchanting dataset.

          Canonical ref:

          ```text
          {essence_ref}
          ```

          Reuse this existing material. Do not add another Essence of Fire record to Alchemy, Enchanting, or Misc.

          No new shared material is required by this slice.

          ---

          ## 8. Unsupported source mechanics / downstream constraints'''
          doc, n = re.subn(
              r'### 7\.4 .*?\n\n---\n\n## 8\. Unsupported source mechanics / downstream constraints',
              replacement_74,
              doc,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'Failed to replace preparation material section 7.4'

          doc = re.sub(
              r'Also add missing `Essence of Fire` to \*\*Enchanting\*\* `732368d4` with the §7\.4 metadata and bump Enchanting independently\.\n\n',
              f'Reuse existing Enchanting `Essence of Fire` at `{essence_ref}`. No shared-material dataset change is required by #221 for this reagent.\n\n',
              doc,
              count=1,
          )
          doc = doc.replace(
              '- Essence of Fire is added once to Enchanting, not duplicated across datasets;',
              f'- Essence of Fire resolves to existing Enchanting `{essence_ref}` and is not duplicated;'
          )

          assert 'Heart of Fire' not in doc
          assert 'Missing shared material: Essence of Fire' not in doc
          assert 'add missing `Essence of Fire`' not in doc
          assert essence_ref in doc

          alchemy_path.write_text(alchemy)
          doc_path.write_text(doc)

          assert alchemy.count('version = 23,') == 1
          assert alchemy.count('id = "mr1600hm"') == 1
          assert alchemy.count('name = "Major Rejuvenation Potion"') == 1
          assert alchemy.count('key = "major-rejuvenation-potion-heal"') == 1
          assert alchemy.count('key = "major-rejuvenation-potion-mana"') == 1

          ss, se = table_span(alchemy, 'spells')
          spells = alchemy[ss:se]
          mid = spells.index('id = "mr1600hm"')
          record_window = spells[max(0, mid - 1800):min(len(spells), mid + 1000)]
          assert 'baseHealing = 1600' in record_window
          assert 'amount = 1600' in record_window
          assert 'resourceRef = "f82db71a:4c8mfm99"' in record_window
          assert 'cooldown = 10' in record_window
          assert 'cooldownGroup = "potion"' in record_window
          assert 'learnMode = "unavailable"' in record_window
          assert 'ignoreGCD = true' in record_window
          assert 'triggersGCD = false' in record_window
          assert record_window.count('type = "caster"') == 2
          assert 'icon = "interface/icons/inv_potion_47.blp"' in record_window

          for field in ('auras', 'items', 'recipes'):
              s, e = table_span(alchemy, field)
              assert alchemy[s:e] == protected_before[field], f'Unexpected {field} modification'

          for stable_id in ('usnkss0q', 'k08wff6m', 'li100drs'):
              assert f'id = "{stable_id}"' in alchemy, f'Missing existing spell {stable_id}'

          print(f'Validated #220: Alchemy 22->23; Major Rejuvenation spell mr1600hm; Essence of Fire ref {essence_ref}.')
          PY

          git diff --check

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'data/default/professions/alchemy.lua',
              '.docs/RPE2-Alchemy-295-300-Preparation.md',
          }
          assert changed == expected, f'Unexpected changed files: {sorted(changed)}'
          print('Scope validated:', ', '.join(sorted(changed)))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua .docs/RPE2-Alchemy-295-300-Preparation.md
          git commit -m "Implement Alchemy 300 item-use spell"
          git push origin dev

name: RPE220 Major Rejuvenation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/rpe220-major-rejuvenation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Diagnose implementation preconditions
        shell: bash
        run: |
          python - <<'PY' > rpe220-diagnostic.txt 2>&1
          from pathlib import Path
          import re
          import traceback

          try:
              a = Path('data/default/professions/alchemy.lua').read_text()
              d = Path('.docs/RPE2-Alchemy-295-300-Preparation.md').read_text()
              e = Path('data/default/professions/enchanting.lua').read_text()

              print('alchemy_v22', len(re.findall(r'^\s*version = 22,\s*$', a, re.M)))
              print('alchemy_v23', len(re.findall(r'^\s*version = 23,\s*$', a, re.M)))
              print('mr_id', a.count('id = "mr1600hm"'))
              print('mr_name', a.count('name = "Major Rejuvenation Potion"'))
              print('heart_doc', d.count('Heart of Fire'))
              print('essence_doc', d.count('Essence of Fire'))
              print('essence_enchanting', e.count('name = "Essence of Fire"'))

              pos = e.find('name = "Essence of Fire"')
              print('essence_pos', pos)
              if pos >= 0:
                  prefix = e[max(0, pos - 3500):pos]
                  ids = re.findall(r'\bid = "([^"]+)"', prefix)
                  print('preceding_ids', ids[-5:])

              def table_span(text, field_name):
                  marker = f'{field_name} = {{'
                  start = text.index(marker)
                  open_pos = text.index('{', start)
                  depth = 0
                  quote = None
                  escape = False
                  i = open_pos
                  while i < len(text):
                      c = text[i]
                      if quote is not None:
                          if escape:
                              escape = False
                          elif c == '\\':
                              escape = True
                          elif c == quote:
                              quote = None
                          i += 1
                          continue
                      if c in ('"', "'"):
                          quote = c
                          i += 1
                          continue
                      if c == '-' and i + 1 < len(text) and text[i + 1] == '-':
                          nl = text.find('\n', i + 2)
                          i = len(text) if nl == -1 else nl + 1
                          continue
                      if c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                      i += 1
                  raise RuntimeError(field_name)

              for f in ('auras', 'items', 'recipes', 'spells'):
                  s, z = table_span(a, f)
                  print('table', f, s, z, z-s)

              test_doc = d.replace('Heart of Fire', 'Essence of Fire')
              pattern = r'### 7\.4 .*?\n\n---\n\n## 8\. Unsupported source mechanics / downstream constraints'
              print('section74_match', bool(re.search(pattern, test_doc, re.S)))
              print('stable_usnkss0q', 'id = "usnkss0q"' in a)
              print('stable_k08wff6m', 'id = "k08wff6m"' in a)
              print('stable_li100drs', 'id = "li100drs"' in a)
          except Exception:
              traceback.print_exc()
              raise
          PY
          cat rpe220-diagnostic.txt

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpe220-diagnostic
          path: rpe220-diagnostic.txt

name: Refine setup wizard skills page

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/refine-setup-wizard-skills-page.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Refine finalize resolution
        run: python .github/scripts/refine_setup_wizard_skills_page.py
      - name: Validate Lua and scope
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -qx 'client/ui/windows/window_SetupWizard.lua'
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p client/ui/windows/window_SetupWizard.lua
          luac5.1 -p core/internal/ruleset/Rules.lua
          luac5.1 -p core/internal/database/Database.lua
          luac5.1 -p core/internal/database/Dependecies.lua
          grep -q 'local setupSkillRows = self:GetSetupSkillRows() or {}' client/ui/windows/window_SetupWizard.lua
          test "$(grep -c 'local setupSkillRows = self:GetSetupSkillRows() or {}' client/ui/windows/window_SetupWizard.lua)" -eq 1
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/ui/windows/window_SetupWizard.lua
          git commit -m 'Avoid repeated setup skill resolution'
          git push origin HEAD:dev

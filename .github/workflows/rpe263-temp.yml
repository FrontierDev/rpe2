name: RPE263 scoped Engineering recipes

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/rpe263-temp.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply and validate #263
        run: python .github/rpe263_apply.py
      - name: Commit scoped result
        run: |
          git diff --check
          git rm .github/rpe263_apply.py .github/workflows/rpe263-temp.yml
          git config user.name "ortellus"
          git config user.email "elvetgames@gmail.com"
          git add data/default/professions/engineering.lua
          git commit -m "Implement Engineering 150-225 recipes for #263"
          git push origin HEAD:dev

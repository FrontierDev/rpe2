name: Refine skill bonus popup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/refine-skill-bonus-popup.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Refine popup
        run: python .github/scripts/refine_skill_bonus_popup.py
      - name: Validate
        run: |
          git diff --check
          test "$(git diff --name-only)" = "client/character/profile/page_ProfileSkills.lua"
          grep -q 'title = "Permanent Skill Bonus"' client/character/profile/page_ProfileSkills.lua
          grep -q 'inputLabel = "Bonus"' client/character/profile/page_ProfileSkills.lua
          ! grep -q 'StaticPopupDialogs' client/character/profile/page_ProfileSkills.lua
          ! grep -q 'StaticPopup_Show' client/character/profile/page_ProfileSkills.lua
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/character/profile/page_ProfileSkills.lua
          git commit -m 'Use profile popup for permanent skill bonuses'
          git push origin HEAD:dev

name: RPE221 Alchemy endgame items

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe221-endgame-items.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Diagnose guarded transform
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee rpe221-diagnostic.txt) 2>&1
          python - <<'PY'
          from pathlib import Path
          import re

          paths = {
              'alchemy': Path('data/default/professions/alchemy.lua'),
              'core': Path('data/default/core.lua'),
              'enchanting': Path('data/default/professions/enchanting.lua'),
              'misc': Path('data/default/professions/misc.lua'),
              'doc': Path('.docs/RPE2-Alchemy-295-300-Preparation.md'),
          }
          for key, path in paths.items():
              print('PATH', key, path, path.exists())
              assert path.exists()

          before = paths['alchemy'].read_text()
          core = paths['core'].read_text()
          enchanting = paths['enchanting'].read_text()
          misc = paths['misc'].read_text()
          doc = paths['doc'].read_text()

          checks = [
              ('alchemy-v23', len(re.findall(r'^\s*version = 23,\s*$', before, re.M)) == 1),
              ('major-rejuv-spell', 'id = "mr1600hm"' in before),
              ('major-rejuv-heal', 'baseHealing = 1600' in before),
              ('major-rejuv-mana-ref', 'resourceRef = "f82db71a:4c8mfm99"' in before),
              ('major-rejuv-amount', 'amount = 1600' in before),
              ('essence-fire-id', enchanting.count('id = "50qj8dzw"') == 1),
              ('essence-fire-name', enchanting.count('name = "Essence of Fire"') == 1),
              ('elemental-fire-id', enchanting.count('id = "sclalidn"') == 1),
              ('elemental-fire-name', enchanting.count('name = "Elemental Fire"') == 1),
              ('heart-wild-id', misc.count('id = "w2plwren"') == 1),
              ('heart-wild-name', misc.count('name = "Heart of the Wild"') == 1),
          ]
          for label, ok in checks:
              print('CHECK', label, ok)
              assert ok, label

          for marker in (
              'Flask of Petrification', 'Flask of the Titans', 'Flask of Distilled Wisdom',
              'Flask of Supreme Power', 'Flask of Chromatic Resistance', 'Major Rejuvenation Potion',
              'Transmute: Elemental Fire', '732368d4:50qj8dzw', '732368d4:sclalidn', '3eb7e9bb:w2plwren',
          ):
              ok = marker in doc
              print('DOC', marker, ok)
              assert ok, marker

          for stat_id in ('ygjno50i','75y3a8ib','7t7xgzcx','0w7c7p09','jjn0my8k','pg0ytacb','954yunb9','itpo751d'):
              count = core.count(f'id = "{stat_id}"')
              print('CORE-ID', stat_id, count)
              assert count == 1, stat_id

          def table_span(text, field):
              marker = f'        {field} = {{'
              start = text.index(marker)
              open_pos = text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  c = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '-' and i + 1 < len(text) and text[i + 1] == '-':
                      newline = text.find('\n', i + 2)
                      assert newline >= 0
                      i = newline + 1
                      continue
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1
              raise AssertionError(field)

          for field in ('auras','items','recipes','spells'):
              s,e = table_span(before,field)
              print('TABLE', field, s, e, e-s)

          s,e = table_span(before,'items')
          items = before[s:e]
          for name in ('Flask of Petrification','Flask of the Titans','Flask of Distilled Wisdom','Flask of Supreme Power','Flask of Chromatic Resistance','Major Rejuvenation Potion'):
              count = items.count(f'name = "{name}"')
              print('ABSENT-NAME', name, count)
              assert count == 0
          for item_id in ('92h163gw','fqzfqzvh','qy3t5uyi','0ymoaskz','9u6ogptd','fdz4n63z'):
              count = before.count(f'id = "{item_id}"')
              print('ABSENT-ID', item_id, count)
              assert count == 0

          print('DIAGNOSTIC PRECONDITIONS OK')
          PY

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpe221-diagnostic
          path: rpe221-diagnostic.txt

name: RPE221 Alchemy endgame items

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe221-endgame-items.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Implement and validate Issue 221
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          alchemy_path = Path('data/default/professions/alchemy.lua')
          core_path = Path('data/default/core.lua')
          enchanting_path = Path('data/default/professions/enchanting.lua')
          misc_path = Path('data/default/misc.lua')
          doc_path = Path('.docs/RPE2-Alchemy-295-300-Preparation.md')

          before = alchemy_path.read_text()
          core = core_path.read_text()
          enchanting = enchanting_path.read_text()
          misc = misc_path.read_text()
          doc = doc_path.read_text()

          assert len(re.findall(r'^\s*version = 23,\s*$', before, re.M)) == 1, 'Expected live Alchemy v23 after #220'
          assert 'id = "mr1600hm"' in before, 'Missing #220 Major Rejuvenation Spell'
          assert 'baseHealing = 1600' in before, 'Major Rejuvenation heal component changed'
          assert 'resourceRef = "f82db71a:4c8mfm99"' in before, 'Major Rejuvenation Mana component changed'
          assert 'amount = 1600' in before, 'Major Rejuvenation Mana amount changed'

          # #219 remains the authoritative inventory/representation source.
          for required in (
              'Flask of Petrification',
              'Flask of the Titans',
              'Flask of Distilled Wisdom',
              'Flask of Supreme Power',
              'Flask of Chromatic Resistance',
              'Major Rejuvenation Potion',
              'Transmute: Elemental Fire',
              '732368d4:50qj8dzw',
              '732368d4:sclalidn',
              '3eb7e9bb:w2plwren',
          ):
              assert required in doc, f'Missing preparation source entry: {required}'

          # Validate shared packaged refs without modifying their owning datasets.
          def assert_named_id(text, item_id, name, radius=2600):
              marker = f'id = "{item_id}"'
              assert text.count(marker) == 1, f'Expected one ID {item_id}'
              pos = text.index(marker)
              window = text[max(0, pos - radius):min(len(text), pos + radius)]
              assert f'name = "{name}"' in window, f'ID {item_id} does not resolve near {name}'

          assert_named_id(enchanting, '50qj8dzw', 'Essence of Fire')
          assert_named_id(enchanting, 'sclalidn', 'Elemental Fire')
          assert_named_id(misc, 'w2plwren', 'Heart of the Wild')

          # Core refs used by the four representable flask traits.
          for stat_id, stat_name in (
              ('ygjno50i', 'Stamina'),
              ('75y3a8ib', 'Intellect'),
              ('7t7xgzcx', 'Spell Power'),
              ('0w7c7p09', 'Fire Resistance'),
              ('jjn0my8k', 'Frost Resistance'),
              ('pg0ytacb', 'Nature Resistance'),
              ('954yunb9', 'Arcane Resistance'),
              ('itpo751d', 'Shadow Resistance'),
          ):
              assert_named_id(core, stat_id, stat_name, radius=3200)

          def table_span(text, field):
              marker = f'        {field} = {{'
              start = text.index(marker)
              open_pos = text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  c = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                      i += 1
                      continue
                  if c == '-' and i + 1 < len(text) and text[i + 1] == '-':
                      newline = text.find('\n', i + 2)
                      if newline < 0:
                          raise AssertionError(f'Unclosed {field} table')
                      i = newline + 1
                      continue
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1
              raise AssertionError(f'Unclosed {field} table')

          protected_before = {}
          for field in ('auras', 'recipes', 'spells'):
              s, e = table_span(before, field)
              protected_before[field] = before[s:e]

          items_start, items_end = table_span(before, 'items')
          items_before = before[items_start:items_end]
          new_names = (
              'Flask of Petrification',
              'Flask of the Titans',
              'Flask of Distilled Wisdom',
              'Flask of Supreme Power',
              'Flask of Chromatic Resistance',
              'Major Rejuvenation Potion',
          )
          for name in new_names:
              assert f'name = "{name}"' not in items_before, f'Item already exists: {name}'

          new_ids = ('92h163gw', 'fqzfqzvh', 'qy3t5uyi', '0ymoaskz', '9u6ogptd', 'fdz4n63z')
          for item_id in new_ids:
              assert f'id = "{item_id}"' not in before, f'ID collision: {item_id}'

          item_records = '''            {
              canDisenchant = false,
              conditions = {
                  {
                      invert = false,
                      minimumValue = 50,
                      showOnTooltip = true,
                      tooltipTextOverride = "",
                      type = "level",
                  },
              },
              consumableType = "flask",
              icon = "interface/icons/inv_potion_26.blp",
              id = "92h163gw",
              itemLevel = 60,
              itemType = "consumable",
              maxStackSize = 5,
              name = "Flask of Petrification",
              quality = "common",
          },
          {
              canDisenchant = false,
              conditions = {
                  {
                      invert = false,
                      minimumValue = 50,
                      showOnTooltip = true,
                      tooltipTextOverride = "",
                      type = "level",
                  },
              },
              consumableTrait = {
                  phase = "event_start",
                  statBonuses = {
                      {
                          operation = "flat",
                          statRef = "f82db71a:ygjno50i",
                          value = 120,
                      },
                  },
              },
              consumableType = "flask",
              icon = "interface/icons/inv_potion_62.blp",
              id = "fqzfqzvh",
              itemLevel = 60,
              itemType = "consumable",
              maxStackSize = 5,
              name = "Flask of the Titans",
              quality = "common",
          },
          {
              canDisenchant = false,
              conditions = {
                  {
                      invert = false,
                      minimumValue = 50,
                      showOnTooltip = true,
                      tooltipTextOverride = "",
                      type = "level",
                  },
              },
              consumableTrait = {
                  phase = "event_start",
                  statBonuses = {
                      {
                          operation = "flat",
                          statRef = "f82db71a:75y3a8ib",
                          value = 200,
                      },
                  },
              },
              consumableType = "flask",
              icon = "interface/icons/inv_potion_97.blp",
              id = "qy3t5uyi",
              itemLevel = 60,
              itemType = "consumable",
              maxStackSize = 5,
              name = "Flask of Distilled Wisdom",
              quality = "common",
          },
          {
              canDisenchant = false,
              conditions = {
                  {
                      invert = false,
                      minimumValue = 50,
                      showOnTooltip = true,
                      tooltipTextOverride = "",
                      type = "level",
                  },
              },
              consumableTrait = {
                  phase = "event_start",
                  statBonuses = {
                      {
                          operation = "flat",
                          statRef = "f82db71a:7t7xgzcx",
                          value = 150,
                      },
                  },
              },
              consumableType = "flask",
              icon = "interface/icons/inv_potion_41.blp",
              id = "0ymoaskz",
              itemLevel = 60,
              itemType = "consumable",
              maxStackSize = 5,
              name = "Flask of Supreme Power",
              quality = "common",
          },
          {
              canDisenchant = false,
              conditions = {
                  {
                      invert = false,
                      minimumValue = 50,
                      showOnTooltip = true,
                      tooltipTextOverride = "",
                      type = "level",
                  },
              },
              consumableTrait = {
                  phase = "event_start",
                  statBonuses = {
                      {
                          operation = "flat",
                          statRef = "f82db71a:0w7c7p09",
                          value = 25,
                      },
                      {
                          operation = "flat",
                          statRef = "f82db71a:jjn0my8k",
                          value = 25,
                      },
                      {
                          operation = "flat",
                          statRef = "f82db71a:pg0ytacb",
                          value = 25,
                      },
                      {
                          operation = "flat",
                          statRef = "f82db71a:954yunb9",
                          value = 25,
                      },
                      {
                          operation = "flat",
                          statRef = "f82db71a:itpo751d",
                          value = 25,
                      },
                  },
              },
              consumableType = "flask",
              icon = "interface/icons/inv_potion_48.blp",
              id = "9u6ogptd",
              itemLevel = 60,
              itemType = "consumable",
              maxStackSize = 5,
              name = "Flask of Chromatic Resistance",
              quality = "common",
          },
          {
              canDisenchant = false,
              conditions = {
                  {
                      invert = false,
                      minimumValue = 50,
                      showOnTooltip = true,
                      tooltipTextOverride = "",
                      type = "level",
                  },
              },
              consumableType = "potion",
              icon = "interface/icons/inv_potion_47.blp",
              id = "fdz4n63z",
              itemLevel = 60,
              itemType = "consumable",
              maxStackSize = 5,
              name = "Major Rejuvenation Potion",
              quality = "common",
              useSpellRef = "d6ffc4e2:mr1600hm",
          },
'''

          after = before.replace('    version = 23,', '    version = 24,', 1)
          _, item_end_after_version = table_span(after, 'items')
          close_pos = item_end_after_version - 1
          after = after[:close_pos] + item_records + after[close_pos:]
          alchemy_path.write_text(after)

          # Exact post-transform validation.
          assert len(re.findall(r'^\s*version = 24,\s*$', after, re.M)) == 1
          items_start, items_end = table_span(after, 'items')
          items_after = after[items_start:items_end]
          for name, item_id in zip(new_names, new_ids):
              assert items_after.count(f'name = "{name}"') == 1, f'Expected one item {name}'
              assert items_after.count(f'id = "{item_id}"') == 1, f'Expected one ID {item_id}'

          def item_record(item_id):
              marker = f'id = "{item_id}"'
              pos = items_after.index(marker)
              # New records are compact and each is comfortably within this window.
              return items_after[max(0, pos - 1800):min(len(items_after), pos + 800)]

          metadata = {
              '92h163gw': ('Flask of Petrification', 'interface/icons/inv_potion_26.blp', 'flask'),
              'fqzfqzvh': ('Flask of the Titans', 'interface/icons/inv_potion_62.blp', 'flask'),
              'qy3t5uyi': ('Flask of Distilled Wisdom', 'interface/icons/inv_potion_97.blp', 'flask'),
              '0ymoaskz': ('Flask of Supreme Power', 'interface/icons/inv_potion_41.blp', 'flask'),
              '9u6ogptd': ('Flask of Chromatic Resistance', 'interface/icons/inv_potion_48.blp', 'flask'),
              'fdz4n63z': ('Major Rejuvenation Potion', 'interface/icons/inv_potion_47.blp', 'potion'),
          }
          for item_id, (name, icon, consumable_type) in metadata.items():
              record = item_record(item_id)
              assert f'name = "{name}"' in record
              assert f'icon = "{icon}"' in record
              assert 'itemLevel = 60' in record
              assert 'minimumValue = 50' in record
              assert 'quality = "common"' in record
              assert 'maxStackSize = 5' in record
              assert 'itemType = "consumable"' in record
              assert f'consumableType = "{consumable_type}"' in record
              assert 'canDisenchant = false' in record

          petrification = item_record('92h163gw')
          assert 'consumableTrait = {' not in petrification
          assert 'useSpellRef =' not in petrification

          titans = item_record('fqzfqzvh')
          assert 'phase = "event_start"' in titans
          assert 'statRef = "f82db71a:ygjno50i"' in titans and 'value = 120' in titans
          assert 'useSpellRef =' not in titans

          wisdom = item_record('qy3t5uyi')
          assert 'phase = "event_start"' in wisdom
          assert 'statRef = "f82db71a:75y3a8ib"' in wisdom and 'value = 200' in wisdom
          assert 'useSpellRef =' not in wisdom

          supreme = item_record('0ymoaskz')
          assert 'phase = "event_start"' in supreme
          assert 'statRef = "f82db71a:7t7xgzcx"' in supreme and 'value = 150' in supreme
          assert 'useSpellRef =' not in supreme

          chromatic = item_record('9u6ogptd')
          assert 'phase = "event_start"' in chromatic
          for ref in ('f82db71a:0w7c7p09', 'f82db71a:jjn0my8k', 'f82db71a:pg0ytacb', 'f82db71a:954yunb9', 'f82db71a:itpo751d'):
              assert chromatic.count(f'statRef = "{ref}"') == 1
          assert chromatic.count('value = 25') == 5
          assert 'useSpellRef =' not in chromatic

          rejuvenation = item_record('fdz4n63z')
          assert 'useSpellRef = "d6ffc4e2:mr1600hm"' in rejuvenation
          assert 'consumableTrait = {' not in rejuvenation

          # The transmute product remains externally owned and must not be duplicated in Alchemy.
          assert 'name = "Elemental Fire"' not in items_after
          assert 'name = "Essence of Fire"' not in items_after
          assert 'name = "Heart of the Wild"' not in items_after

          # No completed Spell/Aura/Recipe data changed under the Item issue.
          for field in ('auras', 'recipes', 'spells'):
              s, e = table_span(after, field)
              assert after[s:e] == protected_before[field], f'Unexpected {field} change'

          # Existing completed <=295 output remains present.
          assert 'name = "Major Mana Potion"' in items_after
          assert 'id = "4cli4txh"' in items_after

          # Check unique Item IDs and names within the canonical Item table.
          ids = re.findall(r'\bid = "([^"]+)"', items_after)
          names = re.findall(r'\bname = "([^"]+)"', items_after)
          assert len(ids) == len(set(ids)), 'Duplicate Item IDs detected'
          assert len(names) == len(set(names)), 'Duplicate Item names detected'

          print('Validated #221 Alchemy v23 -> v24')
          print('Validated 6 new skill-300 Items; 5 flasks + Major Rejuvenation Potion')
          print('Validated 4 event-start flask traits and blocked Petrification metadata-only representation')
          print('Validated Major Rejuvenation useSpellRef d6ffc4e2:mr1600hm')
          print('Validated existing shared refs: Essence of Fire, Elemental Fire, Heart of the Wild')
          print('Validated no Aura, Spell, Recipe, or external packaged-dataset changes')
          PY

          git diff --check

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'data/default/professions/alchemy.lua'}
          assert changed == expected, f'Unexpected changed files: {sorted(changed)}'
          print('Validated changed-file scope:', sorted(changed))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Implement Alchemy 300 endgame items"
          git push origin dev

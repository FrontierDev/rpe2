name: RPE221 Alchemy endgame items

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe221-endgame-items.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Implement and validate Issue 221
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee rpe221-validation.txt) 2>&1
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          alchemy_path = Path('data/default/professions/alchemy.lua')
          before = alchemy_path.read_text()
          core = Path('data/default/core.lua').read_text()
          enchanting = Path('data/default/professions/enchanting.lua').read_text()
          misc = Path('data/default/professions/misc.lua').read_text()
          doc = Path('.docs/RPE2-Alchemy-295-300-Preparation.md').read_text()

          assert len(re.findall(r'^\s*version = 23,\s*$', before, re.M)) == 1
          assert 'id = "mr1600hm"' in before
          assert 'baseHealing = 1600' in before
          assert 'resourceRef = "f82db71a:4c8mfm99"' in before
          assert 'amount = 1600' in before

          for marker in (
              'Flask of Petrification', 'Flask of the Titans', 'Flask of Distilled Wisdom',
              'Flask of Supreme Power', 'Flask of Chromatic Resistance', 'Major Rejuvenation Potion',
              'Transmute: Elemental Fire', '732368d4:50qj8dzw', '732368d4:sclalidn', '3eb7e9bb:w2plwren',
          ):
              assert marker in doc, marker

          assert enchanting.count('id = "50qj8dzw"') == 1 and enchanting.count('name = "Essence of Fire"') == 1
          assert enchanting.count('id = "sclalidn"') == 1 and enchanting.count('name = "Elemental Fire"') == 1
          assert misc.count('id = "w2plwren"') == 1 and misc.count('name = "Heart of the Wild"') == 1
          for stat_id in ('ygjno50i','75y3a8ib','7t7xgzcx','0w7c7p09','jjn0my8k','pg0ytacb','954yunb9','itpo751d'):
              assert core.count(f'id = "{stat_id}"') == 1, stat_id

          def table_span(text, field):
              start = text.index(f'        {field} = {{')
              open_pos = text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  c = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '-' and i + 1 < len(text) and text[i + 1] == '-':
                      newline = text.find('\n', i + 2)
                      assert newline >= 0
                      i = newline + 1
                      continue
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1
              raise AssertionError(field)

          def record_for_id(items_text, item_id):
              pos = items_text.index(f'id = "{item_id}"')
              start = items_text.rfind('\n            {\n', 0, pos)
              assert start >= 0, item_id
              start += 13
              open_pos = items_text.index('{', start)
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(items_text):
                  c = items_text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return items_text[start:i + 1]
                  i += 1
              raise AssertionError(item_id)

          protected = {}
          for field in ('auras', 'recipes', 'spells'):
              s, e = table_span(before, field)
              protected[field] = before[s:e]

          items_start, items_end = table_span(before, 'items')
          items_before = before[items_start:items_end]
          new_names = (
              'Flask of Petrification', 'Flask of the Titans', 'Flask of Distilled Wisdom',
              'Flask of Supreme Power', 'Flask of Chromatic Resistance', 'Major Rejuvenation Potion',
          )
          new_ids = ('92h163gw', 'fqzfqzvh', 'qy3t5uyi', '0ymoaskz', '9u6ogptd', 'fdz4n63z')
          for name in new_names:
              assert f'name = "{name}"' not in items_before
          for item_id in new_ids:
              assert f'id = "{item_id}"' not in before

          encoded_records = ''
          records = base64.b64decode(encoded_records).decode()

          after = before.replace('    version = 23,', '    version = 24,', 1)
          _, items_end_after_version = table_span(after, 'items')
          closing_brace = items_end_after_version - 1
          closing_line_start = after.rfind('\n', 0, closing_brace) + 1
          assert after[closing_line_start:closing_brace].strip() == ''
          after = after[:closing_line_start] + records + after[closing_line_start:]
          alchemy_path.write_text(after)

          assert len(re.findall(r'^\s*version = 24,\s*$', after, re.M)) == 1
          items_start, items_end = table_span(after, 'items')
          items_after = after[items_start:items_end]
          assert items_after.startswith(items_before[:-1].rstrip() + '\n'), 'Existing Item records changed'

          for name, item_id in zip(new_names, new_ids):
              assert items_after.count(f'name = "{name}"') == 1
              assert items_after.count(f'id = "{item_id}"') == 1

          metadata = {
              '92h163gw': ('Flask of Petrification', 'interface/icons/inv_potion_26.blp', 'flask'),
              'fqzfqzvh': ('Flask of the Titans', 'interface/icons/inv_potion_62.blp', 'flask'),
              'qy3t5uyi': ('Flask of Distilled Wisdom', 'interface/icons/inv_potion_97.blp', 'flask'),
              '0ymoaskz': ('Flask of Supreme Power', 'interface/icons/inv_potion_41.blp', 'flask'),
              '9u6ogptd': ('Flask of Chromatic Resistance', 'interface/icons/inv_potion_48.blp', 'flask'),
              'fdz4n63z': ('Major Rejuvenation Potion', 'interface/icons/inv_potion_47.blp', 'potion'),
          }
          for item_id, (name, icon, kind) in metadata.items():
              record = record_for_id(items_after, item_id)
              assert f'name = "{name}"' in record
              assert f'icon = "{icon}"' in record
              assert 'itemLevel = 60' in record and 'minimumValue = 50' in record
              assert 'quality = "common"' in record and 'maxStackSize = 5' in record
              assert 'itemType = "consumable"' in record and f'consumableType = "{kind}"' in record
              assert 'canDisenchant = false' in record

          petrification = record_for_id(items_after, '92h163gw')
          assert 'consumableTrait = {' not in petrification and 'useSpellRef =' not in petrification

          titans = record_for_id(items_after, 'fqzfqzvh')
          assert 'phase = "event_start"' in titans and 'statRef = "f82db71a:ygjno50i"' in titans and 'value = 120' in titans
          assert 'useSpellRef =' not in titans

          wisdom = record_for_id(items_after, 'qy3t5uyi')
          assert 'phase = "event_start"' in wisdom and 'statRef = "f82db71a:75y3a8ib"' in wisdom and 'value = 200' in wisdom
          assert 'useSpellRef =' not in wisdom

          supreme = record_for_id(items_after, '0ymoaskz')
          assert 'phase = "event_start"' in supreme and 'statRef = "f82db71a:7t7xgzcx"' in supreme and 'value = 150' in supreme
          assert 'useSpellRef =' not in supreme

          chromatic = record_for_id(items_after, '9u6ogptd')
          assert 'phase = "event_start"' in chromatic
          for ref in ('f82db71a:0w7c7p09','f82db71a:jjn0my8k','f82db71a:pg0ytacb','f82db71a:954yunb9','f82db71a:itpo751d'):
              assert chromatic.count(f'statRef = "{ref}"') == 1
          assert chromatic.count('value = 25') == 5 and 'useSpellRef =' not in chromatic

          rejuvenation = record_for_id(items_after, 'fdz4n63z')
          assert 'useSpellRef = "d6ffc4e2:mr1600hm"' in rejuvenation and 'consumableTrait = {' not in rejuvenation

          assert 'name = "Elemental Fire"' not in items_after
          assert 'name = "Essence of Fire"' not in items_after
          assert 'name = "Heart of the Wild"' not in items_after

          for field in ('auras', 'recipes', 'spells'):
              s, e = table_span(after, field)
              assert after[s:e] == protected[field], f'Unexpected {field} change'

          assert 'name = "Major Mana Potion"' in items_after and 'id = "4cli4txh"' in items_after
          ids = re.findall(r'\bid = "([^"]+)"', items_after)
          assert len(ids) == len(set(ids)), 'Duplicate Item IDs detected'

          print('Validated #221: Alchemy v23 -> v24')
          print('Validated six new Items: five flasks + Major Rejuvenation Potion')
          print('Validated four event-start flask traits; Petrification metadata-only')
          print('Validated Major Rejuvenation useSpellRef d6ffc4e2:mr1600hm')
          print('Validated external refs unchanged: Essence of Fire, Elemental Fire, Heart of the Wild')
          print('Validated no Aura, Spell, Recipe, runtime, or external dataset changes')
          PY

          git diff --check
          test "$(git diff --name-only)" = "data/default/professions/alchemy.lua"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Implement Alchemy 300 endgame items"
          git push origin dev

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpe221-validation
          path: rpe221-validation.txt

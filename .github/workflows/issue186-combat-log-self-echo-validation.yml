name: issue186-combat-log-self-echo-validation

on:
  push:
    branches:
      - issue-186-combat-log-self-echo

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-186-combat-log-self-echo
          fetch-depth: 0

      - name: Apply host combat-log self-echo suppression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/client_CombatLog.lua')
          text = path.read_text()
          start = text.index('function Client:HandleCombatLog(arguments, sender, distribution, target, message)')
          marker = '    local entryType = normalizeEntryType(arguments and arguments[2])\n'
          insert_at = text.index(marker, start)
          guard = '''    local localPlayerName = Common.NormalizeName and Common.NormalizeName(Common.GetPlayerName and Common.GetPlayerName() or "")
              or tostring(Common.GetPlayerName and Common.GetPlayerName() or "")
          local normalizedSender = Common.NormalizeName and Common.NormalizeName(sender) or tostring(sender or "")
          if (distribution == "PARTY" or distribution == "RAID")
              and localPlayerName ~= ""
              and normalizedSender == localPlayerName
          then
              -- EmitCombatLogEntry already queues the host-local ticker entry before broadcasting.
              -- Ignore the transport's physical self-copy so the ticker/history only receive it once.
              return true
          end

          '''
          block = text[start:insert_at]
          if 'normalizedSender == localPlayerName' in block:
              raise SystemExit('self-echo guard already present')
          path.write_text(text[:insert_at] + guard + text[insert_at:])
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'client/client_CombatLog.lua'
          python3 - <<'PY'
          from pathlib import Path
          text = Path('client/client_CombatLog.lua').read_text()
          start = text.index('function Client:HandleCombatLog(arguments, sender, distribution, target, message)')
          end = text.index('function Client:EmitCombatLogEntry(entry)', start)
          block = text[start:end]
          assert 'distribution == "PARTY" or distribution == "RAID"' in block
          assert 'normalizedSender == localPlayerName' in block
          assert block.index('normalizedSender == localPlayerName') < block.index('local entryType = normalizeEntryType')

          emit = text[end:]
          assert 'local localHandled = self:HandleCombatLog(arguments, Common.GetPlayerName and Common.GetPlayerName() or nil, "LOCAL")' in emit
          assert 'Comms:SendMessage(distribution, COMBAT_LOG_OPCODE, arguments, nil, resolveSendMetadata(COMBAT_LOG_OPCODE))' in emit
          print('Issue 186 combat-log self-echo static assertions: PASS')
          PY

      - name: Lua 5.1 syntax and deterministic HandleCombatLog validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p client/client_CombatLog.lua

          cat >/tmp/issue186_combatlog_test.lua <<'LUA'
          local queued = 0
          local Addon = {
              Client = {},
              Internal = {
                  Comms = { Operations = {} },
                  Profile = {},
                  Database = { Dependecies = {}, Classes = {} },
                  Registry = {},
              },
              Utils = {
                  Common = {
                      GetPlayerName = function() return "Host" end,
                      NormalizeName = function(value) return tostring(value or ""):lower() end,
                  },
              },
              UI = {},
          }

          assert(loadfile('client/client_CombatLog.lua'))(nil, Addon)
          local Client = Addon.Client
          Client.EventState = { active = true, id = 'evt' }
          function Client:NormalizeCombatLogEntry(entry)
              return { eventId = tostring(entry and entry.eventId or '') }
          end
          function Client:QueueCombatLogEntry(entry)
              queued = queued + 1
              return true
          end

          assert(Client:HandleCombatLog({ 'evt', 'status' }, 'Host', 'PARTY') == true)
          assert(queued == 0, 'host PARTY physical self-copy must be ignored')

          assert(Client:HandleCombatLog({ 'evt', 'status' }, 'Host', 'RAID') == true)
          assert(queued == 0, 'host RAID physical self-copy must be ignored')

          assert(Client:HandleCombatLog({ 'evt', 'status' }, 'Remote', 'PARTY') == true)
          assert(queued == 1, 'remote PARTY combat log must still queue')

          assert(Client:HandleCombatLog({ 'evt', 'status' }, 'Host', 'LOCAL') == true)
          assert(queued == 2, 'explicit host LOCAL emission must still queue')

          print('Issue 186 combat-log HandleCombatLog regression: PASS')
          LUA
          lua5.1 /tmp/issue186_combatlog_test.lua

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ortellus"
          git config user.email "elvetgames@gmail.com"
          git add client/client_CombatLog.lua
          git commit -m "Suppress host combat-log transport self-echo (#186)"
          git rm .github/workflows/issue186-combat-log-self-echo-validation.yml
          git commit -m "Remove temporary Issue 186 combat-log validation workflow"
          git push origin HEAD:issue-186-combat-log-self-echo

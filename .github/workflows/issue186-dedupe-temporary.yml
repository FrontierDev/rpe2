name: issue186-dedupe-temporary

on:
  push:
    branches:
      - issue-186-dedupe-validation

permissions:
  contents: write

jobs:
  patch-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-186-dedupe-validation
          fetch-depth: 0

      - name: Apply Issue 186 dedupe/readiness fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          core_path = Path('core/internal/comms/Core.lua')
          core = core_path.read_text()

          cleanup_start = core.index('local function cleanupRecentLocalEchoes(self, now)\n')
          cleanup_end = core.index('local function buildSendMetadata(opcode, metadata)\n', cleanup_start)
          local_echo_helpers = r'''local function normalizeRecentLocalEchoEntry(self, key)
              local stored = self.RecentLocalEchoes and self.RecentLocalEchoes[key] or nil
              if stored == nil then
                  return nil
              end

              if type(stored) == "table" then
                  stored.pendingCount = math.max(0, math.floor(tonumber(stored.pendingCount) or 0))
                  stored.sentCount = math.max(0, math.floor(tonumber(stored.sentCount) or 0))
                  stored.recordedAt = tonumber(stored.recordedAt) or tonumber(stored.sentAt) or 0
                  stored.sentAt = tonumber(stored.sentAt)
                  return stored
              end

              local timestamp = tonumber(stored)
              if timestamp == nil then
                  self.RecentLocalEchoes[key] = nil
                  return nil
              end

              local entry = {
                  pendingCount = 0,
                  sentCount = 1,
                  recordedAt = timestamp,
                  sentAt = timestamp,
              }
              self.RecentLocalEchoes[key] = entry
              return entry
          end

          local function recordRecentLocalEcho(self, prefix, message, distribution, sender, target, now, pending)
              local key = buildRecentLocalEchoKey(prefix, message, distribution, sender, target)
              local entry = normalizeRecentLocalEchoEntry(self, key)
              if not entry then
                  entry = {
                      pendingCount = 0,
                      sentCount = 0,
                      recordedAt = tonumber(now) or 0,
                      sentAt = nil,
                  }
                  self.RecentLocalEchoes[key] = entry
              end

              entry.recordedAt = tonumber(now) or entry.recordedAt or 0
              if pending == true then
                  entry.pendingCount = entry.pendingCount + 1
              else
                  entry.sentCount = entry.sentCount + 1
                  entry.sentAt = tonumber(now) or entry.recordedAt or 0
              end
              return key, entry
          end

          local function markRecentLocalEchoSent(self, prefix, message, distribution, sender, target, now)
              local key = buildRecentLocalEchoKey(prefix, message, distribution, sender, target)
              local entry = normalizeRecentLocalEchoEntry(self, key)
              if not entry or entry.pendingCount <= 0 then
                  return false
              end

              entry.pendingCount = entry.pendingCount - 1
              entry.sentCount = entry.sentCount + 1
              entry.sentAt = tonumber(now) or entry.recordedAt or 0
              return true
          end

          local function releasePendingRecentLocalEcho(self, prefix, message, distribution, sender, target)
              local key = buildRecentLocalEchoKey(prefix, message, distribution, sender, target)
              local entry = normalizeRecentLocalEchoEntry(self, key)
              if not entry or entry.pendingCount <= 0 then
                  return false
              end

              entry.pendingCount = entry.pendingCount - 1
              if entry.pendingCount <= 0 and entry.sentCount <= 0 then
                  self.RecentLocalEchoes[key] = nil
              end
              return true
          end

          local function cleanupRecentLocalEchoes(self, now)
              local timeoutSeconds = tonumber(self.RecentLocalEchoTimeout) or 0
              local maxEntries = tonumber(self.MaxRecentLocalEchoes) or 0
              local entryCount = 0
              local oldestKey = nil
              local oldestAt = nil

              for key in pairs(self.RecentLocalEchoes or {}) do
                  local entry = normalizeRecentLocalEchoEntry(self, key)
                  if entry then
                      local pendingCount = math.max(0, tonumber(entry.pendingCount) or 0)
                      local sentCount = math.max(0, tonumber(entry.sentCount) or 0)
                      if pendingCount <= 0 and sentCount <= 0 then
                          self.RecentLocalEchoes[key] = nil
                      elseif pendingCount <= 0 then
                          local referenceAt = tonumber(entry.sentAt) or tonumber(entry.recordedAt) or 0
                          if timeoutSeconds > 0 and (now - referenceAt) > timeoutSeconds then
                              self.RecentLocalEchoes[key] = nil
                          else
                              entryCount = entryCount + 1
                              if maxEntries > 0 and (oldestAt == nil or referenceAt < oldestAt) then
                                  oldestAt = referenceAt
                                  oldestKey = key
                              end
                          end
                      else
                          -- Pending immediate-local-echo entries correspond to physical packets
                          -- which are still queued/throttled. They must not age out or be evicted.
                          entryCount = entryCount + 1
                      end
                  end
              end

              while maxEntries > 0 and entryCount >= maxEntries and oldestKey do
                  self.RecentLocalEchoes[oldestKey] = nil
                  entryCount = entryCount - 1

                  oldestKey = nil
                  oldestAt = nil
                  for key in pairs(self.RecentLocalEchoes or {}) do
                      local entry = normalizeRecentLocalEchoEntry(self, key)
                      if entry and (tonumber(entry.pendingCount) or 0) <= 0 and (tonumber(entry.sentCount) or 0) > 0 then
                          local referenceAt = tonumber(entry.sentAt) or tonumber(entry.recordedAt) or 0
                          if oldestAt == nil or referenceAt < oldestAt then
                              oldestAt = referenceAt
                              oldestKey = key
                          end
                      end
                  end
              end
          end

          local function shouldSkipDuplicateLocalEcho(self, prefix, message, distribution, sender, target, options)
              if type(options) == "table" and options.localEcho == true then
                  return false
              end

              if distribution ~= "CHANNEL" then
                  return false
              end

              local localPlayerName = normalizeName and normalizeName(getPlayerName and getPlayerName() or nil) or ""
              local normalizedSender = normalizeName and normalizeName(sender) or tostring(sender or "")
              if localPlayerName == "" or normalizedSender ~= localPlayerName then
                  return false
              end

              local key = buildRecentLocalEchoKey(prefix, message, distribution, sender, target)
              local entry = normalizeRecentLocalEchoEntry(self, key)
              if not entry then
                  return false
              end

              if entry.sentCount > 0 then
                  entry.sentCount = entry.sentCount - 1
              elseif entry.pendingCount > 0 then
                  -- The physical self-copy can theoretically be delivered before the
                  -- send-success callback. Consuming the pending slot is still correct.
                  entry.pendingCount = entry.pendingCount - 1
              else
                  self.RecentLocalEchoes[key] = nil
                  return false
              end

              if entry.pendingCount <= 0 and entry.sentCount <= 0 then
                  self.RecentLocalEchoes[key] = nil
              end
              return true
          end

          '''
          core = core[:cleanup_start] + local_echo_helpers + core[cleanup_end:]

          send_start = core.index('    local sendState = {\n', core.index('function Comms:SendMessage'))
          send_end = core.index('    local enqueueStartTime = timedOpcodeKey and getTimingNowMilliseconds() or nil\n', send_start)
          send_preamble = r'''    local localEchoSender = Common.GetPlayerName and Common.GetPlayerName() or (getPlayerName and getPlayerName() or "")
              local sendState = {
                  failed = false,
                  timedOpcodeKey = timedOpcodeKey,
                  totalStartTime = totalStartTime,
                  enqueueElapsedMs = 0,
                  chunkPlanElapsedMs = chunkPlanElapsedMs,
                  queueCheckElapsedMs = queueCheckElapsedMs,
                  immediateLocalEcho = shouldDeliverImmediateLocalEcho(distribution, target, opcode),
              }

              if sendState.immediateLocalEcho == true then
                  for partIndex = 1, partCount do
                      self:ReceiveMessage(
                          self.Prefix,
                          packets[partIndex],
                          distribution,
                          localEchoSender,
                          target,
                          { localEcho = true, immediateLocalEcho = true }
                      )
                  end
              end

              local function releasePendingImmediateLocalEchoes()
                  if sendState.immediateLocalEcho ~= true then
                      return
                  end
                  for partIndex = 1, partCount do
                      releasePendingRecentLocalEcho(
                          self,
                          self.Prefix,
                          packets[partIndex],
                          distribution,
                          localEchoSender,
                          target
                      )
                  end
              end

          '''
          core = core[:send_start] + send_preamble + core[send_end:]

          old_chunk = r'''        onChunkSent = function(item, packet, result)
              if sendState.failed then
                  return
              end

              if sendState.immediateLocalEcho ~= true and shouldEchoOutboundChannel(distribution, target) then
                  self:ReceiveMessage(
                      self.Prefix,
                      packet,
                      distribution,
                      Common.GetPlayerName and Common.GetPlayerName() or (getPlayerName and getPlayerName() or ""),
                      target,
                      { localEcho = true }
                  )
              end
          end,
          '''
          new_chunk = r'''        onChunkSent = function(item, packet, result)
              if sendState.failed then
                  return
              end

              if sendState.immediateLocalEcho == true then
                  markRecentLocalEchoSent(
                      self,
                      self.Prefix,
                      packet,
                      distribution,
                      localEchoSender,
                      target,
                      getTimestamp()
                  )
              elseif shouldEchoOutboundChannel(distribution, target) then
                  self:ReceiveMessage(
                      self.Prefix,
                      packet,
                      distribution,
                      localEchoSender,
                      target,
                      { localEcho = true }
                  )
              end
          end,
          '''
          core = replace_once(core, old_chunk, new_chunk, 'tie local-echo state to successful chunk send')

          old_failed = r'''        onFailed = function(item, result)
              if sendState.failed then
                  return
              end

              sendState.failed = true
              if result ~= "superseded" and Diagnostics.RecordSendFailure then
                  Diagnostics:RecordSendFailure(result)
              end

              Common.InvokeCallback(failedCallback, item, result)
          end,
          '''
          new_failed = r'''        onFailed = function(item, result)
              if sendState.failed then
                  return
              end

              sendState.failed = true
              releasePendingImmediateLocalEchoes()
              if result ~= "superseded" and Diagnostics.RecordSendFailure then
                  Diagnostics:RecordSendFailure(result)
              end

              Common.InvokeCallback(failedCallback, item, result)
          end,
          '''
          core = replace_once(core, old_failed, new_failed, 'release pending local echoes on terminal send failure')

          old_tail = r'''    if enqueueStartTime then
              sendState.enqueueElapsedMs = getTimingNowMilliseconds() - enqueueStartTime
          end

          return queued ~= nil
          end
          '''
          new_tail = r'''    if enqueueStartTime then
              sendState.enqueueElapsedMs = getTimingNowMilliseconds() - enqueueStartTime
          end
          if queued == nil then
              releasePendingImmediateLocalEchoes()
          end

          return queued ~= nil
          end
          '''
          core = replace_once(core, old_tail, new_tail, 'release pending local echoes on enqueue rejection')

          old_record = r'''    if type(options) == "table" and options.localEcho == true then
              local echoKey = buildRecentLocalEchoKey(prefix, message, distribution, sender, target)
              self.RecentLocalEchoes[echoKey] = now
          end
          '''
          new_record = r'''    if type(options) == "table" and options.localEcho == true then
              recordRecentLocalEcho(
                  self,
                  prefix,
                  message,
                  distribution,
                  sender,
                  target,
                  now,
                  options.immediateLocalEcho == true
              )
          end
          '''
          core = replace_once(core, old_record, new_record, 'record lifecycle-aware local echo state')
          core_path.write_text(core)

          resource_path = Path('core/internal/comms/ResourceSync.lua')
          resource = resource_path.read_text()
          resource = replace_once(
              resource,
              '    local rosterComplete = rosterReady and (unitsChunkExpected <= 0 or unitsChunkReceived >= unitsChunkExpected)\n',
              '    local rosterComplete = rosterReady\n',
              'make applied roster completeness monotonic',
          )
          resource_path.write_text(resource)

          event_path = Path('client/client_Event.lua')
          event = event_path.read_text()
          old_start = r'''    nextState.totalTicks = math.max(1, tonumber(nextState.totalTicks) or 1)
              nextState.rosterReady = false
              nextState.unitsReady = false
              nextState.unitsChunkReceived = 0
              nextState.unitsChunkExpected = 0

              if type(self.EventState) == "table" then
          '''
          new_start = r'''    nextState.totalTicks = math.max(1, tonumber(nextState.totalTicks) or 1)

              local currentEventState = self.EventState
              if type(currentEventState) == "table"
                  and currentEventState.active == true
                  and tostring(currentEventState.id or "") ~= ""
                  and tostring(currentEventState.id or "") == tostring(nextState.id or "")
              then
                  if timer then
                      stopEventTiming(timer, currentEventState, {
                          eventId = currentEventState.id,
                          duplicateStart = 1,
                      })
                  end
                  return true
              end

              nextState.rosterReady = false
              nextState.unitsReady = false
              nextState.unitsChunkReceived = 0
              nextState.unitsChunkExpected = 0

              if type(self.EventState) == "table" then
          '''
          event = replace_once(event, old_start, new_start, 'make same-event EVENT_START idempotent')
          event = replace_once(
              event,
              '    if not eventState or eventState.active ~= true or eventState.ending == true or eventState.unitsReady == true then\n',
              '    if not eventState or eventState.active ~= true or eventState.ending == true or eventState.rosterReady == true then\n',
              'ignore chunk-progress readiness mutation after full roster applied',
          )
          event_path.write_text(event)
          PY

      - name: Static and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = $'client/client_Event.lua\ncore/internal/comms/Core.lua\ncore/internal/comms/ResourceSync.lua'

          python3 - <<'PY'
          from pathlib import Path

          core = Path('core/internal/comms/Core.lua').read_text()
          event = Path('client/client_Event.lua').read_text()
          resource = Path('core/internal/comms/ResourceSync.lua').read_text()

          # Canonical roster readiness is monotonic once a full roster has been applied.
          assert 'local rosterComplete = rosterReady\n' in resource
          assert 'rosterReady and (unitsChunkExpected <= 0 or unitsChunkReceived >= unitsChunkExpected)' not in resource
          assert 'unitsReady = rosterComplete and resourcesReady' in resource

          progress_start = event.index('function Client:HandleInboundChunkProgress')
          progress_end = event.index('function Comms:HandleInboundChunkProgress', progress_start)
          progress = event[progress_start:progress_end]
          assert 'eventState.rosterReady == true' in progress
          assert 'eventState.unitsReady == true' not in progress
          assert 'eventState.unitsChunkExpected = expectedCount' in progress
          assert 'eventState.unitsChunkReceived = received' in progress

          # Final EVENT_UNITS application is still present and independent from progress reporting.
          units_start = event.index('function Client:HandleEventUnits(arguments)')
          units_end = event.index('function Client:HandleEventUnitDeltaBatch', units_start)
          units = event[units_start:units_end]
          assert 'local units = Event.DeserializeUnitsFromNetwork' in units
          assert 'eventState.units = units' in units
          assert 'eventState.rosterReady = true' in units

          # Same-event EVENT_START is idempotent and the guard occurs before teardown/replacement.
          start_start = event.index('function Client:HandleEventStart(arguments, sender)')
          start_end = event.index('function Client:HandleEventEnd', start_start)
          start = event[start_start:start_end]
          duplicate_check = 'tostring(currentEventState.id or "") == tostring(nextState.id or "")'
          assert duplicate_check in start
          assert 'duplicateStart = 1' in start
          assert start.index(duplicate_check) < start.index('clearEventStateNow(self, self.EventState, "event-replaced"')
          assert start.index('return true', start.index(duplicate_check)) < start.index('clearEventStateNow(self, self.EventState, "event-replaced"')

          # Transport entries are lifecycle-aware: pending entries do not age/size-evict,
          # successful sends transition them to post-send suppression, terminal failure releases them.
          assert 'pendingCount' in core and 'sentCount' in core
          assert 'local function markRecentLocalEchoSent' in core
          assert 'local function releasePendingRecentLocalEcho' in core
          assert 'Pending immediate-local-echo entries correspond to physical packets' in core
          assert 'if sendState.immediateLocalEcho == true then\n                markRecentLocalEchoSent' in core
          assert 'releasePendingImmediateLocalEchoes()' in core
          assert 'options.immediateLocalEcho == true' in core

          # Deterministic readiness model mirrors the exact new invariants.
          def readiness(roster_ready, resources_ready):
              roster_complete = bool(roster_ready)
              return roster_complete, roster_complete and bool(resources_ready)

          roster_complete, units_ready = readiness(True, False)
          assert roster_complete is True and units_ready is False
          # A delayed duplicate partial transfer may alter diagnostic counters, but cannot regress roster completeness.
          units_chunk_expected, units_chunk_received = 9, 1
          roster_complete_after, units_ready_after = readiness(True, False)
          assert units_chunk_received < units_chunk_expected
          assert roster_complete_after is True and units_ready_after is False

          # Remote client still reports transfer progress while rosterReady is false.
          remote_roster_ready = False
          remote_expected, remote_received = 4, 1
          assert remote_received < remote_expected
          remote_complete, _ = readiness(remote_roster_ready, False)
          assert remote_complete is False
          remote_received = 4
          # Finalization (HandleEventUnits) is the operation that flips rosterReady.
          remote_roster_ready = True
          remote_complete, _ = readiness(remote_roster_ready, False)
          assert remote_complete is True

          # Same-ID duplicate preserves existing object; different IDs still replace.
          def handle_start_model(current, incoming_id):
              if current and current.get('active') and current.get('id') and current.get('id') == incoming_id:
                  return current, False
              return {'active': True, 'id': incoming_id, 'units': []}, True

          existing = {
              'active': True,
              'id': 'evt-a',
              'units': [{'eventID': 1, 'resources': [{'resourceRef': 'health', 'currentValue': 42}]}],
              'startupRuntime': {'phase': 'waiting-resources'},
          }
          same, replaced = handle_start_model(existing, 'evt-a')
          assert same is existing and replaced is False
          assert same['units'][0]['resources'][0]['currentValue'] == 42
          assert same['startupRuntime']['phase'] == 'waiting-resources'
          different, replaced = handle_start_model(existing, 'evt-b')
          assert replaced is True and different is not existing and different['id'] == 'evt-b'

          print('Issue 186 source/readiness/idempotency assertions: PASS')
          PY

          # Explicitly audit that this fix does not alter routing or throttle/backoff policy.
          test -z "$(git diff --name-only -- server/server_Event.lua core/internal/comms/MessageQueue.lua)"

      - name: Lua 5.1 syntax and transport lifecycle validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p client/client_Event.lua
          luac5.1 -p core/internal/comms/Core.lua
          luac5.1 -p core/internal/comms/ResourceSync.lua

          cat > /tmp/issue186_transport_test.lua <<'LUA'
          local now = 0
          local queued = {}
          local dispatched = {}
          local progress = {}

          C_ChatInfo = {
              SendAddonMessage = function()
                  return true
              end,
          }

          local function normalizeName(value)
              return tostring(value or "")
          end

          local Serialization = {}
          function Serialization:BuildChunkToken(partIndex, partCount)
              return tostring(partIndex) .. "/" .. tostring(partCount)
          end
          function Serialization:SerializePacket(prefix, chunkToken, opcode, payload)
              return table.concat({ tostring(prefix), tostring(chunkToken), tostring(opcode), tostring(payload or "") }, "|")
          end
          function Serialization:DeserializePacket(message)
              local prefix, token, opcode, payload = tostring(message):match("^([^|]*)|([^|]*)|([^|]*)|(.*)$")
              if not prefix then
                  return nil
              end
              local partIndex, partCount = token:match("^(%d+)/(%d+)$")
              return {
                  prefix = prefix,
                  opcode = tonumber(opcode),
                  partIndex = tonumber(partIndex),
                  partCount = tonumber(partCount),
                  argumentsText = payload,
              }
          end
          function Serialization:SerializeArguments(arguments)
              return table.concat(arguments or {}, ",")
          end
          function Serialization:DeserializeArguments(text)
              return { text }
          end

          local Operations = {}
          local keys = { [1] = "EVENT_START", [2] = "EVENT_UNITS", [3] = "EVENT_STATE", [9] = "OTHER" }
          function Operations:Get(opcode)
              local key = keys[tonumber(opcode)]
              return key and { key = key } or nil
          end
          function Operations:GetOpcode(key)
              for opcode, candidate in pairs(keys) do
                  if candidate == key then
                      return opcode
                  end
              end
              return nil
          end
          function Operations:Dispatch(opcode, arguments, sender, distribution, target, message)
              dispatched[#dispatched + 1] = {
                  opcode = opcode,
                  sender = sender,
                  distribution = distribution,
                  target = target,
                  message = message,
              }
              return true
          end

          local MessageQueue = {}
          function MessageQueue:CanAccept()
              return true
          end
          function MessageQueue:EnqueueLogicalMessage(prefix, opcode, chunks, distribution, target, callbacks, metadata)
              local item = {
                  prefix = prefix,
                  opcode = opcode,
                  chunks = chunks,
                  distribution = distribution,
                  target = target,
                  callbacks = callbacks,
                  metadata = metadata,
              }
              queued[#queued + 1] = item
              return item
          end

          local Addon = {
              Internal = {
                  Constants = { AddonMessagePrefix = "RPE" },
                  Comms = {
                      Serialization = Serialization,
                      Operations = Operations,
                      MessageQueue = MessageQueue,
                      Diagnostics = {},
                      SafeChunkLength = 4,
                  },
              },
              Utils = {
                  Common = {
                      GetGroupType = function() return "PARTY" end,
                      GetNow = function() return now end,
                      GetPlayerName = function() return "Host" end,
                      NormalizeName = normalizeName,
                      InvokeCallback = function(callback, ...)
                          if type(callback) == "function" then
                              return callback(...)
                          end
                      end,
                  },
              },
              Debug = {},
          }

          local chunk = assert(loadfile('core/internal/comms/Core.lua'))
          chunk(nil, Addon)
          local Comms = Addon.Internal.Comms
          function Comms:HandleInboundChunkProgress(packet, receivedCount, distribution, sender, target)
              progress[#progress + 1] = {
                  opcode = packet.opcode,
                  receivedCount = receivedCount,
                  sender = sender,
              }
              return true
          end

          local function countPending()
              local count = 0
              for _, entry in pairs(Comms.RecentLocalEchoes or {}) do
                  if type(entry) == "table" then
                      count = count + math.max(0, tonumber(entry.pendingCount) or 0)
                  end
              end
              return count
          end

          assert(Comms:SendMessage("CHANNEL", 2, "ABCDEFGHIJKL", 7, {}) == true)
          local item = assert(queued[1])
          assert(#item.chunks > 1, "EVENT_UNITS fixture must be multipart")
          assert(#dispatched == 1, "immediate local echo must finalize EVENT_UNITS once")
          assert(#progress == #item.chunks, "immediate local echo must report its chunk progression")
          assert(countPending() == #item.chunks, "all immediate echoes must remain pending until physical send")

          -- Age beyond the old five-second timeout while the packets are still queued.
          now = 6
          local unrelated = Serialization:SerializePacket("RPE", "1/1", 9, "remote")
          Comms:ReceiveMessage("RPE", unrelated, "CHANNEL", "Other", 7)
          assert(countPending() == #item.chunks, "queued/throttled immediate echoes must not age out")

          local progressBeforePhysical = #progress
          local dispatchBeforePhysical = #dispatched

          -- Simulate successful physical sends followed by their CHANNEL self-copies.
          for index = 1, #item.chunks do
              now = 10 + (index * 0.1)
              item.callbacks.onChunkSent(item, item.chunks[index], 0)
              local beforeProgress = #progress
              local beforeDispatch = #dispatched
              now = now + 0.01
              local duplicate = Comms:ReceiveMessage("RPE", item.chunks[index], "CHANNEL", "Host", 7)
              assert(duplicate == nil, "physical self-copy must be deduplicated")
              assert(#progress == beforeProgress, "deduplicated self-copy must not restart chunk progress")
              assert(#dispatched == beforeDispatch, "deduplicated self-copy must not redispatch logical input")
          end
          assert(#progress == progressBeforePhysical)
          assert(#dispatched == dispatchBeforePhysical)
          assert(countPending() == 0)

          -- A terminally failed immediate-echo send must release unsent pending entries.
          assert(Comms:SendMessage("CHANNEL", 2, "MNOPQRSTUVWX", 7, {}) == true)
          local failedItem = assert(queued[2])
          assert(countPending() == #failedItem.chunks)
          failedItem.callbacks.onFailed(failedItem, "terminal-test")
          assert(countPending() == 0, "terminal failure must release all still-pending echoes")

          -- Non-immediate CHANNEL local echo still enters a post-send suppression window.
          assert(Comms:SendMessage("CHANNEL", 9, "normal", 7, {}) == true)
          local normalItem = assert(queued[3])
          local dispatchedBeforeNormal = #dispatched
          now = 20
          normalItem.callbacks.onChunkSent(normalItem, normalItem.chunks[1], 0)
          assert(#dispatched == dispatchedBeforeNormal + 1, "post-send local echo must still dispatch locally")
          local afterLocalNormal = #dispatched
          now = 20.1
          assert(Comms:ReceiveMessage("RPE", normalItem.chunks[1], "CHANNEL", "Host", 7) == nil)
          assert(#dispatched == afterLocalNormal, "normal CHANNEL physical self-copy must be suppressed")

          print('Issue 186 Core.lua transport lifecycle test: PASS')
          LUA

          lua5.1 /tmp/issue186_transport_test.lua
          echo 'Lua 5.1 syntax validation: PASS'

      - name: Show final diff

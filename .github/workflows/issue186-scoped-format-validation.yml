name: issue186-scoped-format-validation

on:
  push:
    branches:
      - issue-186-dedupe-validation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-186-dedupe-validation
          fetch-depth: 0

      - name: Normalize only Issue 186 callback indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/internal/comms/Core.lua')
          lines = p.read_text().splitlines()

          send_fn = lines.index('function Comms:SendMessage(distribution, opcodeOrPayload, argumentsOrTarget, targetOrMetadata, metadata)')
          send_to_channel = lines.index('function Comms:SendToChannel(channelId, opcodeOrPayload, argumentsOrMetadata, metadata)', send_fn + 1)

          chunk_start = lines.index('        onChunkSent = function(item, packet, result)', send_fn)
          chunk_end = lines.index('        onDelivered = function(item, result)', chunk_start + 1)
          assert chunk_end < send_to_channel
          for i in range(chunk_start + 1, chunk_end):
              if lines[i]:
                  lines[i] = '        ' + lines[i]

          failed_start = lines.index('        onFailed = function(item, result)', chunk_end + 1)
          failed_end = lines.index('    }, diagnosticsMetadata)', failed_start + 1)
          assert failed_end < send_to_channel
          for i in range(failed_start + 1, failed_end):
              if lines[i]:
                  lines[i] = '        ' + lines[i]

          queued_start = lines.index('    if queued == nil then', failed_end + 1)
          assert queued_start < send_to_channel
          queued_end = next(i for i in range(queued_start + 1, send_to_channel) if lines[i] == 'end')
          for i in range(queued_start + 1, queued_end + 1):
              if lines[i]:
                  lines[i] = '    ' + lines[i]

          receive_fn = lines.index('function Comms:ReceiveMessage(prefix, message, distribution, sender, target, options)')
          receive_start = lines.index('    if type(options) == "table" and options.localEcho == true then', receive_fn + 1)
          receive_end = lines.index('    local packet = Serialization:DeserializePacket(message)', receive_start + 1)
          for i in range(receive_start + 1, receive_end):
              if lines[i]:
                  lines[i] = '    ' + lines[i]

          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'core/internal/comms/Core.lua'
          python3 - <<'PY'
          from pathlib import Path
          core = Path('core/internal/comms/Core.lua').read_text()
          event = Path('client/client_Event.lua').read_text()
          resource = Path('core/internal/comms/ResourceSync.lua').read_text()

          assert '\nfunction Comms:SendMessage(' in core
          assert '\nfunction Comms:SendToChannel(' in core
          assert '\n    local queueCheckStartTime = timedOpcodeKey' in core
          assert '\n        onChunkSent = function(item, packet, result)\n            if sendState.failed then' in core
          assert '\n        onFailed = function(item, result)\n            if sendState.failed then' in core
          assert '\n    if queued == nil then\n        releasePendingImmediateLocalEchoes()\n    end' in core
          assert '\n    if type(options) == "table" and options.localEcho == true then\n        recordRecentLocalEcho(' in core

          assert 'local rosterComplete = rosterReady\n' in resource
          assert 'unitsReady = rosterComplete and resourcesReady' in resource
          assert 'rosterReady and (unitsChunkExpected <= 0 or unitsChunkReceived >= unitsChunkExpected)' not in resource

          progress = event[event.index('function Client:HandleInboundChunkProgress'):event.index('function Comms:HandleInboundChunkProgress')]
          assert 'eventState.rosterReady == true' in progress
          assert 'eventState.unitsReady == true' not in progress
          units = event[event.index('function Client:HandleEventUnits(arguments)'):event.index('function Client:HandleEventUnitDeltaBatch')]
          assert 'eventState.units = units' in units and 'eventState.rosterReady = true' in units
          start = event[event.index('function Client:HandleEventStart(arguments, sender)'):event.index('function Client:HandleEventEnd')]
          duplicate = 'tostring(currentEventState.id or "") == tostring(nextState.id or "")'
          assert duplicate in start
          assert start.index(duplicate) < start.index('clearEventStateNow(self, self.EventState, "event-replaced"')

          for required in ('pendingCount','sentCount','markRecentLocalEchoSent','releasePendingImmediateLocalEchoes()','Pending entries are never age-expired or size-evicted.'):
              assert required in core
          print('Issue 186 scoped static validation: PASS')
          PY
          test -z "$(git diff f2eeb44cf3b3833a4ae43a1be3f597bb1733a917 --name-only -- server/server_Event.lua core/internal/comms/MessageQueue.lua)"

      - name: Lua 5.1 syntax and transport regression
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p client/client_Event.lua
          luac5.1 -p core/internal/comms/Core.lua
          luac5.1 -p core/internal/comms/ResourceSync.lua
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          source = subprocess.check_output(['git','show','9e3a9509b54073488d8c7ac74e2f78c4623b7ec4:.github/workflows/issue186-dedupe-v3-temporary.yml'], text=True)
          marker = "          cat > /tmp/issue186_transport_test.lua <<'LUA'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          LUA\n", start)
          block = source[start:end]
          Path('/tmp/issue186_transport_test.lua').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n')
          PY
          lua5.1 /tmp/issue186_transport_test.lua

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ortellus"
          git config user.email "elvetgames@gmail.com"
          git add core/internal/comms/Core.lua
          git commit -m "Normalize Issue 186 transport callback formatting"
          git rm .github/workflows/issue186-scoped-format-validation.yml
          git commit -m "Remove temporary Issue 186 scoped validation workflow"
          git push origin HEAD:issue-186-dedupe-validation

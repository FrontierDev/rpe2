name: Issue 188 item consolidation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/issue-188-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Consolidate and validate profession items
        run: lua5.4 .github/scripts/issue-188-refactor.lua

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test ! -e data/default/professions/leatherworking_300.lua
          test ! -e data/default/professions/tailoring_felcloth.lua
          ! grep -Fq 'data/default/professions/leatherworking_300.lua' RPEngine_Dev.toc
          ! grep -Fq 'data/default/professions/tailoring_felcloth.lua' RPEngine_Dev.toc
          grep -Fq 'version = 10' data/default/professions/leatherworking.lua
          grep -Fq 'name = "Core Armor Kit"' data/default/professions/leatherworking.lua
          grep -Fq 'name = "Felcloth"' data/default/professions/tailoring.lua
          git config user.name "FrontierDev"
          git config user.email "20729370+FrontierDev@users.noreply.github.com"
          git add RPEngine_Dev.toc data/default/professions
          git commit -m "Refactor profession items into canonical datasets"
          git push origin HEAD:dev

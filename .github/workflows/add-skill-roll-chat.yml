name: Add skill roll chat message

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-skill-roll-chat.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply patch
        run: python .github/scripts/add_skill_roll_chat.py
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "client/client_Skills.lua"
          grep -q 'local function emitSkillRollChatMessage(result)' client/client_Skills.lua
          grep -q 'DEFAULT_CHAT_FRAME:AddMessage(message, 0.6, 0.6, 0.6)' client/client_Skills.lua
          grep -q 'emitSkillRollChatMessage(result)' client/client_Skills.lua
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/client_Skills.lua
          git commit -m 'Add grey chat messages for skill rolls'
          git push origin HEAD:dev

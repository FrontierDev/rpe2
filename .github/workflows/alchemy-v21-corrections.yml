name: Alchemy V21 Corrections
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/alchemy-v21-corrections.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply Alchemy v21 corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/default/professions/alchemy.lua')
          text = path.read_text(encoding='utf-8')
          original = text

          assert text.count('    version = 20,') == 1
          assert text.count('    version = 21,') == 0

          def get_section(source, name, next_marker):
              start_marker = f'        {name} = {{\n'
              end_marker = f'        }},\n        {next_marker}'
              start = source.index(start_marker) + len(start_marker)
              end = source.index(end_marker, start)
              return start, end, source[start:end]

          def set_section(source, name, next_marker, inner):
              start, end, _ = get_section(source, name, next_marker)
              return source[:start] + inner + source[end:]

          def records(inner):
              found = re.findall(r'(?ms)^            \{\n.*?^            \},\n', inner)
              assert ''.join(found) == inner
              return found

          def record_id(record):
              match = re.search(r'^                id = "([^"]+)",$', record, flags=re.M)
              assert match
              return match.group(1)

          # Current-state guards.
          _, _, item_inner = get_section(text, 'items', 'loot =')
          item_records = records(item_inner)
          _, _, recipe_inner = get_section(text, 'recipes', 'resources =')
          recipe_records = records(recipe_inner)
          _, _, aura_inner = get_section(text, 'auras', 'authorName =')
          aura_records = records(aura_inner)
          _, _, spell_inner = get_section(text, 'spells', 'stats = {},')
          spell_records = records(spell_inner)

          assert len(recipe_records) == 73
          assert sum(record_id(r) == 'nwnyows7' for r in item_records) == 1
          assert sum(record_id(r) == 'thpzcwrk' for r in recipe_records) == 1
          assert all(record_id(r) != 'li100dra' for r in aura_records)
          assert all(record_id(r) != 'li100drs' for r in spell_records)

          # Remove Elixir of Shadow Power item and recipe.
          item_records = [r for r in item_records if record_id(r) != 'nwnyows7']
          recipe_records = [r for r in recipe_records if record_id(r) != 'thpzcwrk']

          # Fix Elixir of Greater Firepower: +40 Spell Power, matching the ordinary
          # Firepower elixir's existing stat mapping but at the Classic greater value.
          rewritten_items = []
          changed_firepower = 0
          changed_lip_item = 0
          for record in item_records:
              rid = record_id(record)
              if rid == '882yp72p':
                  assert '                consumableElixirType = "battle",\n' in record
                  assert '                consumableTrait = {' not in record
                  needle = '                consumableElixirType = "battle",\n                consumableType = "elixir",\n'
                  replacement = '''                consumableElixirType = "battle",\n                consumableTrait = {\n                    phase = "event_start",\n                    statBonuses = {\n                        {\n                            operation = "flat",\n                            statRef = "f82db71a:7t7xgzcx",\n                            value = 40,\n                        },\n                    },\n                },\n                consumableType = "elixir",\n'''
                  assert record.count(needle) == 1
                  record = record.replace(needle, replacement, 1)
                  changed_firepower += 1
              elif rid == 'kcf75b0d':
                  assert '                name = "Limited Invulnerability Potion",\n' in record
                  assert 'useSpellRef' not in record
                  needle = '                quality = "common",\n'
                  assert record.count(needle) == 1
                  record = record.replace(
                      needle,
                      needle + '                useSpellRef = "d6ffc4e2:li100drs",\n',
                      1,
                  )
                  changed_lip_item += 1
              rewritten_items.append(record)
          assert changed_firepower == 1
          assert changed_lip_item == 1
          text = set_section(text, 'items', 'loot =', ''.join(rewritten_items))
          text = set_section(text, 'recipes', 'resources =', ''.join(recipe_records))

          # Add the one-turn 100% Damage Reduction aura.
          aura_record = '''            {\n                description = "",\n                duration = 1,\n                effects = {\n                    {\n                        baseAmount = 100,\n                        operation = "flat",\n                        statRef = "f82db71a:pu05li08",\n                        statScaling = {},\n                        type = "stat",\n                    },\n                },\n                events = {},\n                icon = "interface/icons/inv_potion_62.blp",\n                id = "li100dra",\n                maxStacks = 1,\n                name = "Limited Invulnerability",\n                stackBehavior = "refresh_duration",\n                tags = {},\n            },\n'''
          _, _, aura_inner = get_section(text, 'auras', 'authorName =')
          assert 'id = "li100dra"' not in aura_inner
          text = set_section(text, 'auras', 'authorName =', aura_inner + aura_record)

          # Add the potion-use spell. The shared potion cooldown remains 10 turns;
          # only the defensive effect lasts one turn.
          spell_record = '''            {\n                castTime = 0,\n                charges = 0,\n                components = {\n                    {\n                        castPhase = "on_cast_end",\n                        castingGroup = "default",\n                        effect = {\n                            auraRef = "d6ffc4e2:li100dra",\n                            basePower = 0,\n                            duration = 1,\n                            stacks = 1,\n                            targetEvents = {},\n                            type = "apply_aura",\n                        },\n                        key = "limited-invulnerability-potion-aura",\n                        target = {\n                            type = "caster",\n                        },\n                    },\n                },\n                conditions = {},\n                cooldown = 10,\n                cooldownGroup = "potion",\n                description = "",\n                icon = "interface/icons/inv_potion_62.blp",\n                id = "li100drs",\n                ignoreGCD = true,\n                learnMode = "unavailable",\n                name = "Limited Invulnerability Potion",\n                resourceCosts = {},\n                tags = {},\n                triggersGCD = false,\n            },\n'''
          _, _, spell_inner = get_section(text, 'spells', 'stats = {},')
          assert 'id = "li100drs"' not in spell_inner
          text = set_section(text, 'spells', 'stats = {},', spell_inner + spell_record)

          text = text.replace('    version = 20,', '    version = 21,', 1)

          # Deterministic final validation.
          assert text.count('    version = 21,') == 1
          assert 'Elixir of Shadow Power' not in text
          assert 'nwnyows7' not in text
          assert 'thpzcwrk' not in text

          _, _, final_items = get_section(text, 'items', 'loot =')
          final_item_records = records(final_items)
          greater = next(r for r in final_item_records if record_id(r) == '882yp72p')
          assert 'statRef = "f82db71a:7t7xgzcx"' in greater
          assert 'value = 40,' in greater
          assert 'consumableElixirType = "battle"' in greater
          ordinary = next(r for r in final_item_records if record_id(r) == 't8f5p1ch')
          assert 'statRef = "f82db71a:7t7xgzcx"' in ordinary
          assert 'value = 10,' in ordinary
          lip_item = next(r for r in final_item_records if record_id(r) == 'kcf75b0d')
          assert 'useSpellRef = "d6ffc4e2:li100drs"' in lip_item

          _, _, final_recipes = get_section(text, 'recipes', 'resources =')
          assert len(records(final_recipes)) == 72

          _, _, final_auras = get_section(text, 'auras', 'authorName =')
          lip_aura = next(r for r in records(final_auras) if record_id(r) == 'li100dra')
          assert 'duration = 1,' in lip_aura
          assert 'baseAmount = 100,' in lip_aura
          assert 'statRef = "f82db71a:pu05li08"' in lip_aura

          _, _, final_spells = get_section(text, 'spells', 'stats = {},')
          lip_spell = next(r for r in records(final_spells) if record_id(r) == 'li100drs')
          assert 'auraRef = "d6ffc4e2:li100dra"' in lip_spell
          assert 'duration = 1,' in lip_spell
          assert 'cooldown = 10,' in lip_spell
          assert 'cooldownGroup = "potion"' in lip_spell

          assert text != original
          path.write_text(text, encoding='utf-8')
          print('Validated Alchemy v21: Shadow Power removed; Greater Firepower +40 Spell Power; Limited Invulnerability +100% Damage Reduction for 1 turn.')
          PY
          git diff --check
          test "$(git diff --name-only)" = "data/default/professions/alchemy.lua"
          git diff --stat -- data/default/professions/alchemy.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Correct Alchemy v21 potion effects"
          git push origin dev

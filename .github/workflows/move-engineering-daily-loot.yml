name: Move Engineering daily loot into dataset

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/move-engineering-daily-loot.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply migration
        run: python .github/scripts/move_engineering_daily_loot.py
      - name: Validate and commit
        run: |
          grep -q 'name = "Engineering Daily Material Cache"' data/default/professions/engineering.lua
          ! grep -q 'engineering_daily_rewards.lua' RPEngine_Dev.toc
          test ! -e data/default/professions/engineering_daily_rewards.lua
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move Engineering daily loot into dataset"
          git push origin HEAD:dev

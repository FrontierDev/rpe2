name: Validate and publish RPEngine release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap-smoke:
    name: Validate bootstrap smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source commit
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install --yes lua5.1
          lua5.1 -v

      - name: Run bootstrap smoke tests
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 tests/CharacterIdentityTest.lua
          lua5.1 tests/DefaultRulesetImportTest.lua
          lua5.1 tests/SetupStartupOrderingTest.lua
          lua5.1 tests/DefaultDatasetStartupTest.lua

  lua-regression:
    name: Run complete Lua regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out source commit
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install --yes lua5.1
          lua5.1 -v

      - name: Run every Lua regression test
        shell: bash
        run: |
          bash .github/scripts/run_lua_tests.sh

  release-package:
    name: Validate release package
    needs:
      - bootstrap-smoke
      - lua-regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag commit on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          toc_version="$(sed -nE 's/^##[[:space:]]*Version:[[:space:]]*(.+)[[:space:]]*$/\1/p' RPEngine2.toc | head -n 1)"
          if [[ -z "$toc_version" ]]; then
            echo "::error::RPEngine2.toc does not contain a usable ## Version field."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            if [[ "$version" != "$toc_version" ]]; then
              echo "::error::Tag version '$version' does not match RPEngine2.toc version '$toc_version'."
              exit 1
            fi
          else
            version="$toc_version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and validate release archive
        run: |
          python3 .github/scripts/package_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --output-dir dist

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check "RPEngine2-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Inspect archive root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import zipfile

          version = "${{ steps.version.outputs.version }}"
          archive_path = f"dist/RPEngine2-{version}.zip"

          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()

          roots = {PurePosixPath(name).parts[0] for name in names}
          if roots != {"RPEngine2"}:
              raise SystemExit(f"unexpected archive roots: {sorted(roots)}")
          if "RPEngine2/RPEngine2.toc" not in names:
              raise SystemExit("archive is missing RPEngine2/RPEngine2.toc")
          print(f"validated {len(names)} archive entries under RPEngine2/")
          PY

      - name: Validate packaged Core dataset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import zipfile
          from pathlib import Path

          archive_path = Path("dist") / "RPEngine2-${{ steps.version.outputs.version }}.zip"
          source_core = Path("data/default/core.lua").read_text(encoding="utf-8")
          source_version = re.search(r"^\s*version\s*=\s*(\d+),", source_core, re.MULTILINE)
          if source_version is None:
              raise SystemExit("source Core dataset has no packaged version")

          with zipfile.ZipFile(archive_path) as archive:
              packaged_core = archive.read("RPEngine2/data/default/core.lua").decode("utf-8")

          packaged_version = re.search(r"^\s*version\s*=\s*(\d+),", packaged_core, re.MULTILINE)
          if packaged_version is None or packaged_version.group(1) != source_version.group(1):
              raise SystemExit("archive Core dataset version does not match source Core dataset version")

          for entry_id in ("nrbvenau", "harscrau", "nrbven01", "harscr01"):
              if packaged_core.count(f'id = "{entry_id}"') != 1:
                  raise SystemExit(f"archive Core dataset entry count is invalid for {entry_id}")

          packaged_warrior = archive.read("RPEngine2/data/default/classes/warrior.lua").decode("utf-8")
          if packaged_warrior.count('id = "cncblow1"') != 1:
              raise SystemExit("archive Warrior dataset is missing a unique Concussive Blow spell")

          print(f"validated packaged Core dataset version {packaged_version.group(1)} and repaired entries")
          PY

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          zip="dist/RPEngine2-${VERSION}.zip"
          checksum="${zip}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$checksum" --clobber
          else
            gh release create "$TAG" "$zip" "$checksum" \
              --title "RPEngine ${VERSION}" \
              --generate-notes
          fi

name: Publish RPEngine release

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish addon package
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if [[ -z "$version" ]]; then
            echo "::error::Release tag does not contain a version."
            exit 1
          fi

          toc_version="$(sed -nE 's/^##[[:space:]]*Version:[[:space:]]*(.+)[[:space:]]*$/\1/p' RPEngine2.toc | head -n 1)"
          if [[ -z "$toc_version" ]]; then
            echo "::error::RPEngine2.toc does not contain a usable Version field."
            exit 1
          fi

          if [[ "$version" != "$toc_version" ]]; then
            echo "::error::Tag version '$version' does not match RPEngine2.toc version '$toc_version'."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and validate release archive
        run: |
          python3 .github/scripts/package_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --output-dir dist

      - name: Verify published checksum input
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check "RPEngine2-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          zip="dist/RPEngine2-${VERSION}.zip"
          checksum="${zip}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$checksum" --clobber
          else
            gh release create "$TAG" "$zip" "$checksum" \
              --title "RPEngine ${VERSION}" \
              --generate-notes
          fi

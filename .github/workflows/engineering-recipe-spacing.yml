name: Engineering recipe spacing

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/engineering-recipe-spacing.yml

permissions:
  contents: write

jobs:
  rebalance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Rebalance Engineering recipe levels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/default/professions/engineering.lua')
          text = path.read_text(encoding='utf-8')

          changes = {
              'Crafted Light Shot': (1, 10),
              'Handful of Copper Bolts': (30, 20),
              'Copper Tube': (50, 40),
              'Crafted Heavy Shot': (75, 85),
              'EZ-Thro Dynamite': (100, 95),
              'Deadly Blunderbuss': (105, 115),
              'Solid Dynamite': (175, 165),
          }

          def trainer_cost(level):
              # Existing Engineering curve: 1.6L^2 + 28L + 75 copper.
              return int(1.6 * level * level + 28 * level + 75)

          def find_matching_brace(s, open_pos):
              depth = 0
              in_string = False
              escape = False
              for i in range(open_pos, len(s)):
                  ch = s[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError('Unmatched brace')

          marker = '        recipes = {'
          section_start = text.index(marker)
          open_pos = text.index('{', section_start)
          close_pos = find_matching_brace(text, open_pos)
          body = text[open_pos + 1:close_pos]

          entries = []
          i = 0
          while i < len(body):
              if body[i] != '{':
                  i += 1
                  continue
              end = find_matching_brace(body, i)
              j = end + 1
              while j < len(body) and body[j] in ' \t':
                  j += 1
              if j < len(body) and body[j] == ',':
                  j += 1
              if j < len(body) and body[j] == '\r':
                  j += 1
              if j < len(body) and body[j] == '\n':
                  j += 1
              entries.append((i, j, body[i:j]))
              i = j

          rebuilt = []
          cursor = 0
          seen = set()
          for start, end, entry in entries:
              rebuilt.append(body[cursor:start])
              name_match = re.search(r'\n\s*name = "([^"]+)",', entry)
              name = name_match.group(1) if name_match else None
              if name in changes:
                  old_level, new_level = changes[name]
                  level_pattern = rf'(requiredSkillLevel = ){old_level}(,)'
                  entry, n1 = re.subn(level_pattern, rf'\g<1>{new_level}\2', entry, count=1)
                  if n1 != 1:
                      raise RuntimeError(f'{name}: expected requiredSkillLevel {old_level}')
                  old_cost = trainer_cost(old_level)
                  new_cost = trainer_cost(new_level)
                  cost_pattern = rf'(trainerCostCopper = ){old_cost}(,)'
                  entry, n2 = re.subn(cost_pattern, rf'\g<1>{new_cost}\2', entry, count=1)
                  if n2 != 1:
                      raise RuntimeError(f'{name}: expected trainer cost {old_cost}')
                  seen.add(name)
              rebuilt.append(entry)
              cursor = end
          rebuilt.append(body[cursor:])

          if seen != set(changes):
              raise RuntimeError(f'Missing recipes: {sorted(set(changes) - seen)}')

          text = text[:open_pos + 1] + ''.join(rebuilt) + text[close_pos:]

          # Bump packaged dataset version.
          vm = re.search(r'(Addon\.Data\.DefaultDatasets:Register\(\{\s*\n\s*version = )(\d+)(,)', text)
          if not vm:
              raise RuntimeError('Dataset version not found')
          old_version = int(vm.group(2))
          text = text[:vm.start(2)] + str(old_version + 1) + text[vm.end(2):]

          # Validate every distinct Engineering recipe unlock up to 300 has a maximum gap of 10.
          rs = text.index(marker)
          ro = text.index('{', rs)
          rc = find_matching_brace(text, ro)
          recipe_body = text[ro + 1:rc]
          levels = sorted(set(int(v) for v in re.findall(r'requiredSkillLevel = (\d+),', recipe_body) if int(v) <= 300))
          gaps = [(a, b, b - a) for a, b in zip(levels, levels[1:]) if b - a > 10]
          if gaps:
              raise RuntimeError(f'Recipe spacing still exceeds 10 skill: {gaps}')

          for name, (_, new_level) in changes.items():
              idx = text.index(f'name = "{name}"', ro, rc)
              # Local window is sufficient because requiredSkillLevel follows the output block.
              window = text[idx:idx + 1200]
              if f'requiredSkillLevel = {new_level},' not in window:
                  raise RuntimeError(f'{name}: new level {new_level} not found after rewrite')
              if f'trainerCostCopper = {trainer_cost(new_level)},' not in window:
                  raise RuntimeError(f'{name}: recalculated trainer cost not found')

          path.write_text(text, encoding='utf-8')
          print('Adjusted recipes:')
          for name, (old, new) in changes.items():
              print(f'  {name}: {old} -> {new} (cost {trainer_cost(new)})')
          print('Distinct recipe levels <=300:', levels)
          print(f'Dataset version: {old_version} -> {old_version + 1}')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/engineering.lua
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Rebalance low-level Engineering recipe progression"
          git push origin HEAD:dev

name: RPE189 Leatherworking Trainer Correction

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe189-trainer-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Convert all Leatherworking recipes to trainer learning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("data/default/professions/leatherworking.lua")
          text = path.read_text(encoding="utf-8")

          # Every canonical recipe has exactly one requiredSkillLevel field.
          recipe_count = len(re.findall(r'^\s*requiredSkillLevel = \d+,\s*$', text, re.MULTILINE))
          assert recipe_count == 278, f"Expected 278 canonical Leatherworking recipes, found {recipe_count}"

          # Older canonical entries may omit learnMode; Recipe.lua defaults those to trainer.
          mode_pattern = re.compile(r'^\s*learnMode = "([^"]+)",\s*$', re.MULTILINE)
          before_modes = mode_pattern.findall(text)
          assert len(before_modes) == 175, f"Expected 175 explicit learn modes, found {len(before_modes)}"
          unexpected = sorted(set(before_modes) - {"trainer", "book"})
          assert not unexpected, f"Unexpected Leatherworking learn modes before correction: {unexpected}"
          book_count = before_modes.count("book")
          trainer_count = before_modes.count("trainer")
          assert book_count > 0, "Expected at least one book-mode Leatherworking recipe to correct"
          print(f"Before: 278 recipes; {trainer_count} explicit trainer, {book_count} explicit book, {278 - len(before_modes)} implicit trainer")

          corrected = text.replace('learnMode = "book"', 'learnMode = "trainer"')

          version_pattern = re.compile(r'^    version = (\d+),\s*$', re.MULTILINE)
          versions = version_pattern.findall(corrected)
          assert versions == ["12"], f"Expected canonical Leatherworking dataset version 12, found {versions}"
          corrected, replacements = version_pattern.subn('    version = 13,', corrected, count=1)
          assert replacements == 1, "Failed to bump Leatherworking packaged dataset version"

          after_recipe_count = len(re.findall(r'^\s*requiredSkillLevel = \d+,\s*$', corrected, re.MULTILINE))
          after_modes = mode_pattern.findall(corrected)
          assert after_recipe_count == 278, f"Recipe count changed during correction: {after_recipe_count}"
          assert len(after_modes) == len(before_modes), "Explicit learn-mode field count changed"
          assert set(after_modes) == {"trainer"}, f"Non-trainer explicit recipe mode remains: {sorted(set(after_modes))}"
          assert corrected.count('learnMode = "book"') == 0, "Book-mode recipe remains"
          assert corrected.count('learnMode = "trainer"') == len(before_modes), "Explicit trainer-mode count mismatch"
          assert version_pattern.findall(corrected) == ["13"], "Packaged dataset version did not become 13"

          path.write_text(corrected, encoding="utf-8")
          print(f"After: all 278 recipes resolve as trainer; converted {book_count} explicit book recipes; dataset version 13")
          PY

      - name: Validate and commit correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff -- data/default/professions/leatherworking.lua | grep -c '^[-+] *learnMode = ' || true)" -gt 0
          grep -q '^    version = 13,$' data/default/professions/leatherworking.lua
          ! grep -q 'learnMode = "book"' data/default/professions/leatherworking.lua
          test "$(grep -c 'learnMode = "trainer"' data/default/professions/leatherworking.lua)" -eq 175
          test "$(grep -Ec '^\s*requiredSkillLevel = [0-9]+,\s*$' data/default/professions/leatherworking.lua)" -eq 278

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/leatherworking.lua
          git rm .github/workflows/rpe189-trainer-correction.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Make Leatherworking recipes trainer-learned"
          git push origin HEAD:dev

name: RPE189 Leatherworking Trainer Correction

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe189-trainer-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Convert all Leatherworking recipes to trainer learning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("data/default/professions/leatherworking.lua")
          text = path.read_text(encoding="utf-8")

          def recipe_table_slice(source):
              marker = "        recipes = {"
              marker_at = source.index(marker)
              open_at = source.index("{", marker_at)
              depth = 0
              in_string = False
              quote = ""
              escaped = False
              recipe_entries = 0
              for i in range(open_at, len(source)):
                  ch = source[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          in_string = False
                      continue
                  if ch in ('"', "'"):
                      in_string = True
                      quote = ch
                      continue
                  if ch == "{":
                      if depth == 1:
                          recipe_entries += 1
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return source[open_at:i + 1], recipe_entries
              raise AssertionError("Unterminated recipes table")

          recipes_before, recipe_count = recipe_table_slice(text)
          assert recipe_count == 179, f"Expected 179 canonical Leatherworking recipes, found {recipe_count}"

          # Older canonical entries may omit learnMode; Recipe.lua defaults those to trainer.
          mode_pattern = re.compile(r'^\s*learnMode = "([^"]+)",\s*$', re.MULTILINE)
          before_modes = mode_pattern.findall(recipes_before)
          unexpected = sorted(set(before_modes) - {"trainer", "book"})
          assert not unexpected, f"Unexpected Leatherworking learn modes before correction: {unexpected}"
          book_count = before_modes.count("book")
          trainer_count = before_modes.count("trainer")
          implicit_trainer_count = recipe_count - len(before_modes)
          assert book_count > 0, "Expected at least one book-mode Leatherworking recipe to correct"
          print(f"Before: {recipe_count} recipes; {trainer_count} explicit trainer, {book_count} explicit book, {implicit_trainer_count} implicit trainer")

          corrected = text.replace('learnMode = "book"', 'learnMode = "trainer"')

          version_pattern = re.compile(r'^    version = (\d+),\s*$', re.MULTILINE)
          versions = version_pattern.findall(corrected)
          assert versions == ["12"], f"Expected canonical Leatherworking dataset version 12, found {versions}"
          corrected, replacements = version_pattern.subn('    version = 13,', corrected, count=1)
          assert replacements == 1, "Failed to bump Leatherworking packaged dataset version"

          recipes_after, after_recipe_count = recipe_table_slice(corrected)
          after_modes = mode_pattern.findall(recipes_after)
          assert after_recipe_count == 179, f"Recipe count changed during correction: {after_recipe_count}"
          assert len(after_modes) == len(before_modes), "Explicit learn-mode field count changed"
          assert set(after_modes) == {"trainer"}, f"Non-trainer explicit recipe mode remains: {sorted(set(after_modes))}"
          assert 'learnMode = "book"' not in recipes_after, "Book-mode recipe remains"
          assert after_modes.count("trainer") + (after_recipe_count - len(after_modes)) == 179, "Not all recipes resolve to trainer learning"
          assert version_pattern.findall(corrected) == ["13"], "Packaged dataset version did not become 13"

          path.write_text(corrected, encoding="utf-8")
          print(f"After: all 179 recipes resolve as trainer; converted {book_count} explicit book recipes; dataset version 13")
          PY

      - name: Validate and commit correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff -- data/default/professions/leatherworking.lua | grep -c '^[-+] *learnMode = ' || true)" -gt 0
          grep -q '^    version = 13,$' data/default/professions/leatherworking.lua
          ! grep -q 'learnMode = "book"' data/default/professions/leatherworking.lua

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/leatherworking.lua
          git rm .github/workflows/rpe189-trainer-correction.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Make Leatherworking recipes trainer-learned"
          git push origin HEAD:dev

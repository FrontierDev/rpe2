name: RPE218 Alchemy Recipes
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rpe218-alchemy-recipes.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch and validate Alchemy recipes
        shell: bash
        run: |
          cat > /tmp/rpe218.py <<'PY'
          from pathlib import Path
          import math
          import re

          REPO = Path('.')
          path = REPO / 'data/default/professions/alchemy.lua'
          table_path = REPO / '.github/rpe218-recipes.tsv'
          text = path.read_text(encoding='utf-8')

          if text.count('    version = 15,') != 1:
              raise SystemExit('Expected exactly one Alchemy version 15 declaration')

          marker = '        },\n        resources = {},\n        skills = {},'
          marker_index = text.rfind(marker)
          if marker_index < 0:
              raise SystemExit('Could not locate end of Alchemy recipes table')

          recipes_start = text.find('        recipes = {')
          if recipes_start < 0 or recipes_start >= marker_index:
              raise SystemExit('Could not locate Alchemy recipes table')
          old_recipe_text = text[recipes_start:marker_index]

          rows = []
          for line_number, raw in enumerate(table_path.read_text(encoding='utf-8').splitlines(), 1):
              if not raw.strip():
                  continue
              parts = raw.split('|')
              if len(parts) != 6:
                  raise SystemExit(f'Invalid recipe row {line_number}: expected 6 fields')
              recipe_id, skill_text, mode, name, output_ref, input_text = parts
              skill = int(skill_text)
              inputs = []
              for raw_input in input_text.split(';'):
                  ref, qty_text, kind = raw_input.split(',')
                  inputs.append((ref, int(qty_text), kind))
              rows.append({
                  'id': recipe_id,
                  'skill': skill,
                  'mode': mode,
                  'name': name,
                  'output': output_ref,
                  'inputs': inputs,
              })

          if len(rows) != 45:
              raise SystemExit(f'Expected 45 recipes, found {len(rows)}')
          if len({r['id'] for r in rows}) != 45:
              raise SystemExit('New recipe IDs are not unique')
          if len({r['name'] for r in rows}) != 45:
              raise SystemExit('New recipe names are not unique')
          if sum(r['mode'] == 'trainer' for r in rows) != 7:
              raise SystemExit('Expected 7 trainer recipes')
          if sum(r['mode'] == 'book' for r in rows) != 38:
              raise SystemExit('Expected 38 book recipes')
          if any(r['mode'] not in {'trainer', 'book'} for r in rows):
              raise SystemExit('Unexpected learnMode in recipe table')
          if min(r['skill'] for r in rows) != 230 or max(r['skill'] for r in rows) != 295:
              raise SystemExit('Recipe skill range must be 230..295')
          if any(r['skill'] <= 225 or r['skill'] > 295 for r in rows):
              raise SystemExit('Recipe outside issue #218 skill scope')
          if sum(any(kind == 'tool' for _, _, kind in r['inputs']) for r in rows) != 9:
              raise SystemExit('Expected 9 transmute/tool recipes')
          if sum(r['name'].startswith('Transmute:') for r in rows) != 9:
              raise SystemExit('Expected 9 transmute recipes')
          if any(kind not in {'rpe_item', 'tool'} for r in rows for _, _, kind in r['inputs']):
              raise SystemExit('Unsupported Recipe input kind')
          if any(qty < 1 for r in rows for _, qty, _ in r['inputs']):
              raise SystemExit('Recipe input quantity below 1')

          for row in rows:
              if f'id = "{row["id"]}"' in old_recipe_text:
                  raise SystemExit(f'Recipe ID already exists: {row["id"]}')
              if f'name = "{row["name"]}"' in old_recipe_text:
                  raise SystemExit(f'Recipe name already exists: {row["name"]}')

          # Resolve every input/output ref against the current packaged datasets.
          dataset_items = {}
          for lua_path in (REPO / 'data/default').rglob('*.lua'):
              candidate = lua_path.read_text(encoding='utf-8')
              match = re.search(r'^        id = "([^"]+)",?$', candidate, re.M)
              if not match:
                  continue
              dataset_id = match.group(1)
              ids = set(re.findall(r'^\s{16}id = "([^"]+)",?$', candidate, re.M))
              dataset_items.setdefault(dataset_id, set()).update(ids)

          def require_ref(ref, context):
              if ':' not in ref:
                  raise SystemExit(f'Invalid ref {ref} in {context}')
              dataset_id, object_id = ref.split(':', 1)
              if object_id not in dataset_items.get(dataset_id, set()):
                  raise SystemExit(f'Unresolved ref {ref} in {context}')

          for row in rows:
              require_ref(row['output'], row['name'] + ' output')
              for ref, _, _ in row['inputs']:
                  require_ref(ref, row['name'] + ' input')

          by_name = {r['name']: r for r in rows}
          if ('7259f1d3:8p3vdy2m', 1, 'rpe_item') not in by_name['Ghost Dye']['inputs']:
              raise SystemExit('Ghost Dye must use Tailoring Purple Dye')
          arcanite = by_name['Transmute: Arcanite']
          for expected_input in [
              ('61fdf3df:5m4zt99z', 1, 'rpe_item'),
              ('4999dcec:kzswtd0z', 1, 'rpe_item'),
              ('d6ffc4e2:y9p4s8nt', 1, 'tool'),
          ]:
              if expected_input not in arcanite['inputs']:
                  raise SystemExit(f'Arcanite transmute missing {expected_input}')
          stoneshield = by_name['Greater Stoneshield Potion']
          if ('61fdf3df:5m4zt99z', 1, 'rpe_item') not in stoneshield['inputs']:
              raise SystemExit('Greater Stoneshield must use Blacksmithing Thorium Bar')
          if 'Thorium Ore' in table_path.read_text(encoding='utf-8'):
              raise SystemExit('Thorium Ore must not be introduced by issue #218')
          for row in rows:
              if row['name'].startswith('Transmute:'):
                  tool_rows = [entry for entry in row['inputs'] if entry[2] == 'tool']
                  if tool_rows != [('d6ffc4e2:y9p4s8nt', 1, 'tool')]:
                      raise SystemExit(f'{row["name"]} must require one Philosopher\'s Stone tool')

          def lua_quote(value):
              return value.replace('\\', '\\\\').replace('"', '\\"')

          generated = []
          for row in rows:
              cost = math.floor(75 + row['skill'] * 28 + row['skill'] * row['skill'] * 1.6)
              generated.extend([
                  '            {',
                  '                category = "",',
                  '                description = "",',
                  f'                id = "{row["id"]}",',
                  '                inputs = {',
              ])
              for ref, qty, kind in row['inputs']:
                  generated.extend([
                      '                    {',
                      f'                        itemRef = "{ref}",',
                      f'                        kind = "{kind}",',
                      f'                        quantity = {qty},',
                      '                    },',
                  ])
              generated.extend([
                  '                },',
                  f'                learnMode = "{row["mode"]}",',
                  f'                name = "{lua_quote(row["name"])}",',
                  '                output = {',
                  f'                    itemRef = "{row["output"]}",',
                  '                    maxQuantity = 1,',
                  '                    minQuantity = 1,',
                  '                },',
                  '                reagents = {},',
                  f'                requiredSkillLevel = {row["skill"]},',
                  '                results = {},',
                  '                skillRef = "f82db71a:pdyzyudy",',
                  '                tags = {},',
                  f'                trainerCostCopper = {cost},',
                  '            },',
              ])
          block = '\n'.join(generated) + '\n'

          text = text[:marker_index] + block + text[marker_index:]
          text = text.replace('    version = 15,', '    version = 16,', 1)
          path.write_text(text, encoding='utf-8')

          # Post-write deterministic checks on the emitted Lua.
          new_text = path.read_text(encoding='utf-8')
          if new_text.count('    version = 16,') != 1:
              raise SystemExit('Alchemy version did not advance to 16')
          for row in rows:
              if new_text.count(f'id = "{row["id"]}"') != 1:
                  raise SystemExit(f'Recipe ID not emitted exactly once: {row["id"]}')
          emitted = new_text[recipes_start:new_text.rfind(marker)]
          levels = [int(v) for v in re.findall(r'requiredSkillLevel = (\d+)', emitted)]
          if any(level > 295 for level in levels):
              raise SystemExit('Alchemy contains a recipe above skill 295 after issue #218')
          new_ids = set(r['id'] for r in rows)
          new_recipe_chunks = []
          for recipe_id in new_ids:
              if f'id = "{recipe_id}"' not in emitted:
                  raise SystemExit(f'New recipe absent from recipe table: {recipe_id}')
          if emitted.count('skillRef = "f82db71a:pdyzyudy"') < 45:
              raise SystemExit('Missing Alchemy skillRef on emitted recipes')
          if 'Thorium Ore' in emitted:
              raise SystemExit('Thorium Ore appeared in emitted recipe data')

          print('Validated 45 issue #218 recipes: 7 trainer, 38 book, 9 transmutes, skills 230..295')
          PY

          python3 /tmp/rpe218.py
          git diff --check
          git diff -- data/default/professions/alchemy.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default/professions/alchemy.lua
          git commit -m "Implement issue #218 Alchemy recipes"
          git push origin HEAD:dev
